name: Filesystem Static Quality Patch

on:
  push:
    branches:
      - agent/filesystem-recovery-repair

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Synchronize branch
        run: |
          sleep 10
          git fetch origin agent/filesystem-recovery-repair
          git reset --hard origin/agent/filesystem-recovery-repair
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Apply typed fixture cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_filesystem_preflight_failures.py')
          text = path.read_text(encoding='utf-8')
          if '    DeviceIdentity,\n' not in text:
              text = text.replace(
                  'from ares.filesystems.models import (\n',
                  'from ares.filesystems.models import (\n    DeviceIdentity,\n',
                  1,
              )
          text = text.replace(
              '    def inspect(self, identity) -> MountSafetyReport:\n',
              '    def inspect(self, identity: DeviceIdentity) -> MountSafetyReport:\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          cat > backend/tests/test_filesystem_real_image.py <<'PY'
          from __future__ import annotations

          import shutil
          from pathlib import Path
          from typing import Any

          import pytest

          from ares.filesystems.executor import LocalTestFilesystemExecutor
          from ares.filesystems.integrity import repair_plan_fingerprint
          from ares.filesystems.models import (
              FilesystemHealth,
              FilesystemRepairPlan,
              FilesystemType,
              MountSafetyReport,
              RepairAction,
          )
          from ares.protection import ProtectionCheckpoint, ProtectionCheckpointStatus
          from ares.tools.filesystem import FilesystemToolSuite, MountSafetyChecker
          from ares.tools.storage import SafeProcessRunner

          _REQUIRED_FIXTURE_TOOLS = ("mkfs.ext4", "debugfs", "e2fsck", "blkid")


          async def test_real_ext4_image_is_detected_repaired_and_verified(
              tmp_path: Path,
          ) -> None:
              missing = [tool for tool in _REQUIRED_FIXTURE_TOOLS if shutil.which(tool) is None]
              if missing:
                  pytest.skip(
                      "isolated ext4 integration tools unavailable: " + ",".join(missing)
                  )

              image = tmp_path / "corrupted-ext4.img"
              with image.open("wb") as handle:
                  handle.truncate(32 * 1024 * 1024)
              runner = SafeProcessRunner()
              created = await runner.run(
                  "mkfs.ext4", ("-F", "-q", str(image)), timeout_seconds=60
              )
              assert created.exit_code == 0
              corrupted = await runner.run(
                  "debugfs",
                  (
                      "-w",
                      "-R",
                      "set_super_value free_blocks_count 1",
                      str(image),
                  ),
                  timeout_seconds=60,
              )
              assert corrupted.exit_code == 0

              tools = FilesystemToolSuite(
                  runner=runner,
                  mount_checker=MountSafetyChecker(scan_processes=False),
                  allow_regular_file_targets=True,
              )
              executor = LocalTestFilesystemExecutor(tools)
              inspection = await executor.inspect(str(image))
              assert inspection.filesystem is FilesystemType.EXT4
              assert inspection.health is FilesystemHealth.INCONSISTENT
              resource_id = f"filesystem:{inspection.identity.fingerprint_sha256}"
              checkpoint = ProtectionCheckpoint(
                  status=ProtectionCheckpointStatus.READY,
                  protected_resources=(resource_id,),
                  resource_fingerprints={
                      resource_id: inspection.identity.fingerprint_sha256
                  },
                  provider_capability_id="backup.create",
                  backup_id="real-image-backup-12345678",
                  verification_id="real-image-verification-12345678",
                  session_id="real-image-session-123",
                  evidence_sha256="e" * 64,
                  limitations=(
                      "synthetic test checkpoint for isolated image fixture",
                  ),
              )
              draft = FilesystemRepairPlan(
                  session_id="real-image-session-123",
                  target=inspection.identity,
                  filesystem=FilesystemType.EXT4,
                  mount=MountSafetyReport(
                      mounted=False,
                      busy=False,
                      swap=False,
                      safe_to_unmount=False,
                      safe_to_remount=False,
                  ),
                  detected_problems=(
                      inspection.check.problems if inspection.check else ()
                  ),
                  evidence=inspection.check.evidence if inspection.check else (),
                  required_tools=inspection.required_tools,
                  required_permissions=("block-device.readwrite",),
                  protection_checkpoint=checkpoint,
                  repair_actions=(
                      RepairAction(
                          id="filesystem.repair",
                          description="Repair only the isolated ext4 image fixture.",
                          mutates_target=True,
                      ),
                  ),
                  verification_steps=("Run e2fsck -f -n after repair",),
                  rollback_strategy=(
                      "Test image can be discarded; no physical device is involved."
                  ),
                  executable=True,
                  fingerprint_sha256="0" * 64,
              )
              plan = draft.model_copy(
                  update={"fingerprint_sha256": repair_plan_fingerprint(draft)}
              )
              challenges: list[str] = []

              async def on_challenge(challenge_id: str) -> None:
                  challenges.append(challenge_id)

              grant = await executor.request_authorization(
                  plan, on_challenge=on_challenge
              )
              stages: list[str] = []

              async def on_stage(name: str, payload: dict[str, Any]) -> None:
                  del payload
                  stages.append(name)

              outcome = await executor.execute(plan, grant, on_stage=on_stage)

              assert challenges
              assert outcome.before.health is FilesystemHealth.INCONSISTENT
              assert outcome.repair_tool == "e2fsck"
              assert outcome.repair_exit_code in {0, 1, 2}
              assert outcome.after.health is FilesystemHealth.HEALTHY
              assert "filesystem.repair-command.started" in stages
              assert "filesystem.verification.completed" in stages
          PY
      - name: Enforce Ruff and mypy before publishing patch
        working-directory: backend
        run: |
          uv sync --frozen --dev --python 3.12
          uv run --frozen ruff check --fix src tests || true
          uv run --frozen ruff format src tests
          uv run --frozen ruff format --check src tests
          uv run --frozen ruff check src tests
          uv run --frozen mypy
      - name: Remove this temporary patch workflow and publish
        run: |
          rm -f .github/workflows/filesystem-quality-patch.yml
          git config user.name "ARES Static Quality"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "filesystem: satisfy strict static quality"
            git pull --rebase origin agent/filesystem-recovery-repair
            git push origin HEAD:agent/filesystem-recovery-repair
          fi
