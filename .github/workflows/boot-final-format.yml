name: Boot Final Test Formatter

on:
  push:
    branches:
      - agent/boot-recovery-management

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/boot-recovery-management
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.14
          python-version: '3.12'
          working-directory: backend
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Isolate fixture and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("backend/tests/test_boot_tool_runtime_edges.py")
          text = path.read_text(encoding="utf-8")
          old = '''    with pytest.raises(BootToolError, match="UMOUNT_UNAVAILABLE"):
        await RepairEnvironmentTool(runner).cleanup_paths(("/fixture",))

    runner = _ConfigurableRunner()
    runner.fail_tool = "umount"'''
          new = '''    with pytest.raises(BootToolError, match="UMOUNT_UNAVAILABLE"):
        await RepairEnvironmentTool(runner).cleanup_paths(("/fixture",))
    runner.available_tools.add("umount")

    runner = _ConfigurableRunner()
    runner.fail_tool = "umount"'''
          if old not in text:
              raise SystemExit("fixture anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cd backend
          uv run --frozen ruff format tests/test_boot_tool_runtime_edges.py
          uv run --frozen ruff check tests/test_boot_tool_runtime_edges.py
          uv run --frozen mypy
          uv run --frozen pytest -q --no-cov tests/test_boot_tool_runtime_edges.py
      - name: Commit validated test and remove formatter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/boot-final-format.yml
          git add backend/tests/test_boot_tool_runtime_edges.py
          git diff --cached --check
          git commit -m 'Finalize Boot Tool Layer coverage tests'
          git push origin HEAD:agent/boot-recovery-management
