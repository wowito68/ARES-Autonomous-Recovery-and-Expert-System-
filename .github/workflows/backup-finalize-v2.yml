name: Backup finalize v2

on:
  push:
    branches:
      - agent/backup-snapshot-manager

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/backup-snapshot-manager
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend

      - name: Refresh branch and require documentation maintenance
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            git pull --ff-only origin agent/backup-snapshot-manager || true
            if grep -q "Backup & Snapshot Manager increment" docs/architecture.md; then
              exit 0
            fi
            sleep 10
          done
          echo "Backup documentation maintenance did not finish." >&2
          exit 1

      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen --dev

      - name: Patch terminal events and one-use grant ordering
        shell: python
        run: |
          from pathlib import Path
          import re

          service = Path("backend/src/ares/backup/service.py")
          text = service.read_text(encoding="utf-8")
          marker = 'event_type="backup.cancelled" if cancelled else "backup.failed"'
          if marker not in text:
              anchor = (
                  '        await self.store.put_backup(\n'
                  '            backup.model_copy(update={"status": status, "execution": execution})\n'
                  '        )\n'
              )
              if anchor not in text:
                  raise RuntimeError("terminal backup store block not found")
              event = (
                  '        await self.event_bus.publish(\n'
                  '            AresEvent(\n'
                  '                event_type="backup.cancelled" if cancelled else "backup.failed",\n'
                  '                source="backup.service",\n'
                  '                correlation_id=backup.execution.workflow_execution_id or backup.id,\n'
                  '                session_id=backup.session_id,\n'
                  '                severity=(\n'
                  '                    EventSeverity.WARNING if cancelled else EventSeverity.ERROR\n'
                  '                ),\n'
                  '                payload={"backup_id": backup.id, "error_code": code},\n'
                  '            )\n'
                  '        )\n'
              )
              text = text.replace(anchor, anchor + event, 1)
          service.write_text(text, encoding="utf-8")

          broker = Path("backend/src/ares/runtime/broker.py")
          text = broker.read_text(encoding="utf-8")
          revalidate = '        await asyncio.to_thread(self.tools.revalidate_plan, plan)\n'
          grant_line = '        grant = AuthorizationGrant.model_validate(request.get("grant"))\n'
          pop_line = '            stored = self._grants.pop(grant.id, None)\n'
          create_start = text.index("    async def _create(")
          create_end = text.index("    async def _verify(", create_start)
          block = text[create_start:create_end]
          grant_pos = block.index(grant_line)
          pop_pos = block.index(pop_line)
          revalidate_pos = block.index(revalidate)
          if revalidate_pos < pop_pos:
              block = block.replace(revalidate, "", 1)
              session_line = '        session_id = grant.session_id\n'
              if session_line not in block:
                  raise RuntimeError("broker session line not found")
              block = block.replace(session_line, revalidate + session_line, 1)
              text = text[:create_start] + block + text[create_end:]
          broker.write_text(text, encoding="utf-8")

          main = Path("backend/src/ares/main.py")
          text = main.read_text(encoding="utf-8")
          text = text.replace("from fastapi.responses import HTMLResponse\n", "")
          start = text.find('        index_path = resolved_settings.static_dir / "index.html"\n')
          if start >= 0:
              mount = text.find("        application.mount(\n", start)
              if mount < 0:
                  raise RuntimeError("static mount block not found")
              text = text[:start] + text[mount:]
          main.write_text(text, encoding="utf-8")

          index = Path("live/config/includes.chroot/usr/share/ares/platform/index.html")
          html = index.read_text(encoding="utf-8")
          loader = '<script src="/backup.js" defer></script>'
          if loader not in html:
              html = html.replace("</body>", f"  {loader}\n</body>")
              index.write_text(html, encoding="utf-8")

      - name: Write strictly typed backup environment tests
        run: |
          cat > backend/tests/test_backup_environment_failures.py <<'PY'
          from __future__ import annotations

          import os
          import shutil
          from datetime import UTC, datetime
          from pathlib import Path
          from typing import Any

          import pytest

          import ares.tools.backup as backup_module
          from ares.backup.models import (
              Backup,
              BackupExecution,
              BackupPlan,
              BackupPolicy,
              BackupProgress,
              BackupStatus,
              BackupVerificationStatus,
          )
          from ares.tools.backup import BackupFilesystemTools, BackupToolError


          def _fixture(
              tmp_path: Path,
              *,
              destination_fs: str = "ext4",
          ) -> tuple[BackupFilesystemTools, Path, Path]:
              source = tmp_path / "source"
              destination = tmp_path / "destination"
              source.mkdir()
              destination.mkdir()
              (source / "file.txt").write_text("data", encoding="utf-8")
              device = os.stat(source).st_dev
              source_device = f"{os.major(device)}:{os.minor(device)}"
              mountinfo = tmp_path / "mountinfo"
              mountinfo.write_text(
                  f"36 25 {source_device} / {source} rw - ext4 /dev/sda1 rw\n"
                  f"37 25 99:99 / {destination} rw - {destination_fs} /dev/sdb1 rw\n",
                  encoding="utf-8",
              )
              return BackupFilesystemTools(mountinfo), source, destination


          def _backup(plan: BackupPlan) -> Backup:
              progress = BackupProgress(
                  files_completed=plan.included_file_count,
                  files_total=plan.included_file_count,
                  bytes_completed=plan.source.estimated_size_bytes,
                  bytes_total=plan.source.estimated_size_bytes,
                  percent=100,
                  eta_seconds=0,
              )
              return Backup(
                  id=plan.backup_id,
                  created_at=datetime.now(UTC),
                  source=plan.source,
                  destination=plan.destination,
                  size=plan.source.estimated_size_bytes,
                  file_count=plan.included_file_count,
                  status=BackupStatus.VERIFYING,
                  created_by="test",
                  session_id="environment-session-123",
                  plan_id=plan.id,
                  execution=BackupExecution(
                      backup_id=plan.backup_id,
                      status=BackupStatus.VERIFYING,
                      progress=progress,
                  ),
              )


          def test_plan_rejects_incompatible_destination_filesystem(tmp_path: Path) -> None:
              tools, source, destination = _fixture(tmp_path, destination_fs="tmpfs")
              with pytest.raises(
                  BackupToolError, match="BACKUP_DESTINATION_FILESYSTEM_INCOMPATIBLE"
              ):
                  tools.build_plan(str(source), str(destination), BackupPolicy())


          def test_revalidation_detects_disconnected_destination(tmp_path: Path) -> None:
              tools, source, destination = _fixture(tmp_path)
              plan = tools.build_plan(str(source), str(destination), BackupPolicy())
              destination.rmdir()
              with pytest.raises(BackupToolError, match="BACKUP_DESTINATION_INVALID"):
                  tools.revalidate_plan(plan)


          def test_plan_reports_insufficient_source_permission(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              tools, source, destination = _fixture(tmp_path)
              original = backup_module.os.scandir

              def denied(path: os.PathLike[str] | str) -> Any:
                  if Path(path) == source:
                      raise PermissionError("denied")
                  return original(path)

              monkeypatch.setattr(backup_module.os, "scandir", denied)
              with pytest.raises(BackupToolError, match="BACKUP_SOURCE_NOT_READABLE"):
                  tools.build_plan(str(source), str(destination), BackupPolicy())


          async def test_backup_does_not_depend_on_external_copy_or_hash_tools(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              tools, source, destination = _fixture(tmp_path)
              monkeypatch.setattr(shutil, "which", lambda _: None)
              plan = tools.build_plan(str(source), str(destination), BackupPolicy())

              async def noop(_: Any) -> None:
                  return None

              manifest = await tools.create_backup(plan, noop, noop)
              verification = await tools.verify_backup(_backup(plan), manifest)
              assert manifest.file_count == 1
              assert verification.status is BackupVerificationStatus.VERIFIED
          PY

      - name: Write strictly typed backup control tests
        run: |
          cat > backend/tests/test_backup_controls.py <<'PY'
          from __future__ import annotations

          import argparse
          import asyncio
          import os
          from pathlib import Path
          from typing import Any, cast

          import pytest
          from fastapi import FastAPI
          from httpx import AsyncClient
          from pydantic import BaseModel, ConfigDict

          import ares.cli as cli_module
          from ares.backup import (
              BackupPlan,
              BackupPolicy,
              BackupService,
              LocalTestBackupExecutor,
              UnixBrokerBackupExecutor,
          )
          from ares.backup.executor import BackupExecutorError
          from ares.capabilities import CapabilityManager
          from ares.protection import ProtectionCheckpoint, ProtectionCheckpointStatus
          from ares.tools import BackupFilesystemTools


          def _configure_mounts(app: FastAPI, tmp_path: Path) -> tuple[Path, Path]:
              source = tmp_path / "source"
              destination = tmp_path / "destination"
              source.mkdir()
              destination.mkdir()
              device = os.stat(source).st_dev
              source_device = f"{os.major(device)}:{os.minor(device)}"
              mountinfo = tmp_path / "mountinfo"
              mountinfo.write_text(
                  f"36 25 {source_device} / {source} rw - ext4 /dev/sda1 rw\n"
                  f"37 25 99:99 / {destination} rw - ext4 /dev/sdb1 rw\n",
                  encoding="utf-8",
              )
              cast(BackupFilesystemTools, app.state.backup_tools).mountinfo_path = mountinfo
              return source, destination


          async def test_api_cancel_stops_running_backup(
              client: AsyncClient,
              app: FastAPI,
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              source, destination = _configure_mounts(app, tmp_path)
              (source / "file.bin").write_bytes(b"x" * 1024)
              executor = cast(LocalTestBackupExecutor, app.state.backup_executor)
              entered = asyncio.Event()

              async def blocked_create(
                  plan: BackupPlan,
                  grant: Any,
                  *,
                  on_progress: Any,
                  on_entry: Any,
              ) -> Any:
                  del plan, grant, on_progress, on_entry
                  entered.set()
                  await asyncio.Event().wait()
                  raise AssertionError("unreachable")

              monkeypatch.setattr(executor, "create", blocked_create)
              plan = cast(
                  dict[str, Any],
                  (
                      await client.post(
                          "/api/v1/backups/plan",
                          json={"source": str(source), "destination": str(destination)},
                      )
                  ).json(),
              )
              accepted = cast(
                  dict[str, Any],
                  (
                      await client.post(
                          "/api/v1/backups",
                          json={"plan_id": plan["id"], "request_authorization": True},
                      )
                  ).json(),
              )
              backup_id = cast(str, cast(dict[str, Any], accepted["backup"])["id"])
              await asyncio.wait_for(entered.wait(), timeout=2)
              response = await client.post(f"/api/v1/backups/{backup_id}/cancel")
              assert response.status_code == 200
              payload: dict[str, Any] = {}
              for _ in range(50):
                  current = await client.get(f"/api/v1/backups/{backup_id}")
                  payload = cast(dict[str, Any], current.json())
                  if payload["status"] == "CANCELLED":
                      break
                  await asyncio.sleep(0.02)
              assert payload["status"] == "CANCELLED"
              execution = cast(dict[str, Any], payload["execution"])
              assert execution["error_code"] == "BACKUP_CANCELLED"


          class _SessionPayload(BaseModel):
              model_config = ConfigDict(extra="forbid", frozen=True)
              session_id: str


          def test_protection_checkpoint_gate_is_ready_for_future_mutations(
              app: FastAPI,
          ) -> None:
              manager = cast(CapabilityManager, app.state.capability_manager)
              metadata = manager.get("backup.create")
              assert metadata is not None
              protected = metadata.model_copy(update={"requires_protection_checkpoint": True})
              payload = _SessionPayload(session_id="checkpoint-session-123")
              with pytest.raises(PermissionError, match="verified protection checkpoint"):
                  manager._validate_protection_checkpoint(protected, payload, None)
              wrong_session = ProtectionCheckpoint(
                  status=ProtectionCheckpointStatus.READY,
                  protected_resources=("resource:documents",),
                  provider_capability_id="backup.create",
                  backup_id="backup-12345678",
                  verification_id="verification-12345678",
                  session_id="another-session-123",
                  evidence_sha256="a" * 64,
              )
              with pytest.raises(PermissionError, match="another session"):
                  manager._validate_protection_checkpoint(
                      protected, payload, wrong_session
                  )
              ready = wrong_session.model_copy(update={"session_id": payload.session_id})
              manager._validate_protection_checkpoint(protected, payload, ready)


          async def test_unix_broker_executor_reports_response_timeout(tmp_path: Path) -> None:
              socket_path = tmp_path / "slow.sock"
              tools = BackupFilesystemTools(tmp_path / "mountinfo")
              source = tmp_path / "src"
              destination = tmp_path / "dst"
              source.mkdir()
              destination.mkdir()
              (source / "file.txt").write_text("data", encoding="utf-8")
              device = os.stat(source).st_dev
              source_device = f"{os.major(device)}:{os.minor(device)}"
              tools.mountinfo_path.write_text(
                  f"36 25 {source_device} / {source} rw - ext4 /dev/sda1 rw\n"
                  f"37 25 99:99 / {destination} rw - ext4 /dev/sdb1 rw\n",
                  encoding="utf-8",
              )
              plan = tools.build_plan(str(source), str(destination), BackupPolicy())

              async def slow(
                  reader: asyncio.StreamReader, writer: asyncio.StreamWriter
              ) -> None:
                  await reader.readline()
                  await asyncio.sleep(1)
                  writer.close()
                  await writer.wait_closed()

              server = await asyncio.start_unix_server(slow, path=str(socket_path))
              executor = UnixBrokerBackupExecutor(socket_path, timeout_seconds=0.02)

              async def challenge(_: str) -> None:
                  return None

              try:
                  with pytest.raises(BackupExecutorError, match="BACKUP_BROKER_TIMEOUT"):
                      await executor.request_authorization(
                          plan,
                          session_id="timeout-session-123",
                          on_challenge=challenge,
                      )
              finally:
                  server.close()
                  await server.wait_closed()


          def test_cli_parser_exposes_required_backup_commands() -> None:
              parser = cli_module.build_parser()
              plan = parser.parse_args(["backup", "plan", "/source", "/destination"])
              create = parser.parse_args(["backup", "create", "/source", "/destination"])
              listing = parser.parse_args(["backup", "list"])
              verify = parser.parse_args(["backup", "verify", "backup-12345678"])
              consent = parser.parse_args(["consent", "approve", "challenge-12345678"])
              assert (plan.backup_command, plan.source, plan.destination) == (
                  "plan",
                  "/source",
                  "/destination",
              )
              assert create.backup_command == "create"
              assert listing.backup_command == "list"
              assert verify.backup_id == "backup-12345678"
              assert consent.consent_command == "approve"


          async def test_cli_backup_plan_uses_same_service(
              client: AsyncClient,
              app: FastAPI,
              tmp_path: Path,
              capsys: pytest.CaptureFixture[str],
          ) -> None:
              del client
              source, destination = _configure_mounts(app, tmp_path)
              (source / "file.txt").write_text("data", encoding="utf-8")
              args = argparse.Namespace(
                  command="backup",
                  backup_command="plan",
                  source=str(source),
                  destination=str(destination),
              )
              result = await cli_module._backup_command(args, app)
              assert result == 0
              output = capsys.readouterr().out
              assert '"authorization_required": true' in output
              service = cast(BackupService, app.state.backup_service)
              assert await service.list() == ()
          PY

      - name: Format and enforce Python quality
        working-directory: backend
        run: |
          uv run --frozen ruff format src tests
          uv run --frozen ruff check src tests
          uv run --frozen mypy

      - name: Run full test suite with coverage gate
        working-directory: backend
        run: uv run --frozen pytest --cov-report=term-missing

      - name: Validate backup frontend syntax
        run: node --check live/config/includes.chroot/usr/share/ares/platform/backup.js

      - name: Restore strict final Backend CI
        run: |
          cat > .github/workflows/backend-ci.yml <<'YAML'
          name: Backend CI

          on:
            push:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            quality:
              name: Python quality and build
              runs-on: ubuntu-latest
              timeout-minutes: 15
              defaults:
                run:
                  working-directory: backend
              steps:
                - name: Check out repository
                  uses: actions/checkout@v6
                  with:
                    persist-credentials: false
                - name: Install uv and Python 3.12
                  uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
                  with:
                    version: "0.11.14"
                    python-version: "3.12"
                    working-directory: backend
                - name: Install locked dependencies
                  run: uv sync --frozen --dev
                - name: Enforce formatting
                  run: uv run --frozen ruff format --check src tests
                - name: Enforce Ruff
                  run: uv run --frozen ruff check src tests
                - name: Enforce strict mypy
                  run: uv run --frozen mypy
                - name: Build package
                  run: uv build

            tests:
              name: Tests / Python ${{ matrix.python-version }}
              runs-on: ubuntu-latest
              timeout-minutes: 20
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.12", "3.13"]
              defaults:
                run:
                  working-directory: backend
              steps:
                - name: Check out repository
                  uses: actions/checkout@v6
                  with:
                    persist-credentials: false
                - name: Install uv and Python ${{ matrix.python-version }}
                  uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
                  with:
                    version: "0.11.14"
                    python-version: ${{ matrix.python-version }}
                    working-directory: backend
                - name: Install locked dependencies
                  run: uv sync --frozen --dev
                - name: Run tests with coverage gate
                  run: >-
                    uv run --frozen pytest
                    --junitxml=test-results-${{ matrix.python-version }}.xml
                    --cov-report=term-missing
                    --cov-report=xml:coverage-${{ matrix.python-version }}.xml

            static-syntax:
              name: Shell and UI syntax
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Check out repository
                  uses: actions/checkout@v6
                  with:
                    persist-credentials: false
                - name: Validate tracked shell scripts
                  shell: bash
                  run: |
                    set -euo pipefail
                    checked=0
                    while IFS= read -r -d '' file; do
                      first_line="$(head -n 1 "$file" || true)"
                      case "$first_line" in
                        *bash*)
                          bash -n "$file"
                          checked=$((checked + 1))
                          ;;
                        *"/sh"*)
                          dash -n "$file"
                          checked=$((checked + 1))
                          ;;
                      esac
                    done < <(git ls-files -z)
                    echo "Validated ${checked} tracked shell scripts."
                - name: Validate platform JavaScript syntax
                  run: |
                    node --check live/config/includes.chroot/usr/share/ares/platform/app.js
                    node --check live/config/includes.chroot/usr/share/ares/platform/storage.js
                    node --check live/config/includes.chroot/usr/share/ares/platform/backup.js
          YAML

      - name: Remove every temporary backup workflow and commit validated tree
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/backup-slice-maintenance.yml \
            .github/workflows/backup-slice-cleanup.yml \
            .github/workflows/backup-security-patch.yml \
            .github/workflows/backup-security-patch2.yml \
            .github/workflows/backup-final-patch.yml \
            .github/workflows/backup-finalize-v2.yml
          git add backend/src backend/tests docs live/config/includes.chroot/usr/share/ares/platform .github/workflows/backend-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize validated backup slice"
          git pull --rebase origin agent/backup-snapshot-manager
          git push origin HEAD:agent/backup-snapshot-manager
