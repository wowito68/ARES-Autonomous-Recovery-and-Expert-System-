name: Filesystem Repair Release Verification

on:
  push:
    branches:
      - agent/filesystem-recovery-repair
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Synchronize current branch
        run: |
          sleep 30
          git fetch origin agent/filesystem-recovery-repair
          git reset --hard origin/agent/filesystem-recovery-repair
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Complete deterministic typing patches
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('backend/src/ares/filesystems/service.py')
          service = service_path.read_text(encoding='utf-8')
          if '    ProtectionCheckpoint,\n' not in service:
              service = service.replace(
                  'from ares.protection import (\n',
                  'from ares.protection import (\n    ProtectionCheckpoint,\n',
                  1,
              )
          service = service.replace(
              '        checkpoint = None\n',
              '        checkpoint: ProtectionCheckpoint | None = None\n',
              1,
          )
          service = service.replace(
              '        permissions = ("block-device.readwrite",)\n',
              '        permissions: tuple[str, ...] = ("block-device.readwrite",)\n',
              1,
          )
          service_path.write_text(service, encoding='utf-8')

          broker_path = Path('backend/src/ares/runtime/filesystem_broker.py')
          broker = broker_path.read_text(encoding='utf-8')
          if 'from collections.abc import Awaitable, Callable\n' not in broker:
              broker = broker.replace(
                  'import os\n',
                  'import os\nfrom collections.abc import Awaitable, Callable\n',
                  1,
              )
          if 'FilesystemBrokerSend = Callable' not in broker:
              marker = 'from ares.tools.filesystem import FilesystemToolError, FilesystemToolSuite\n\n\n'
              broker = broker.replace(
                  marker,
                  marker + 'FilesystemBrokerSend = Callable[[dict[str, Any]], Awaitable[None]]\n\n\n',
                  1,
              )
          broker = broker.replace(
              '        send,\n    ) -> dict[str, Any]:',
              '        send: FilesystemBrokerSend,\n    ) -> dict[str, Any]:',
              1,
          )
          broker = broker.replace(
              '    async def _authorize(self, request: dict[str, Any], send) -> dict[str, Any]:',
              '    async def _authorize(\n        self, request: dict[str, Any], send: FilesystemBrokerSend\n    ) -> dict[str, Any]:',
              1,
          )
          broker = broker.replace(
              '    async def _execute(self, request: dict[str, Any], send) -> dict[str, Any]:',
              '    async def _execute(\n        self, request: dict[str, Any], send: FilesystemBrokerSend\n    ) -> dict[str, Any]:',
              1,
          )
          broker_path.write_text(broker, encoding='utf-8')
          PY
      - name: Install Python 3.12 environment
        working-directory: backend
        run: uv sync --frozen --dev --python 3.12
      - name: Normalize then enforce quality
        working-directory: backend
        run: |
          uv run --frozen ruff check --fix src tests || true
          uv run --frozen ruff format src tests
          uv run --frozen ruff format --check src tests
          uv run --frozen ruff check src tests
          uv run --frozen mypy
          uv build
      - name: Python 3.12 full suite
        working-directory: backend
        run: |
          uv run --frozen pytest --junitxml=/tmp/junit-312.xml --cov-report=term-missing --cov-report=xml:/tmp/coverage-312.xml
      - name: Recreate environment with Python 3.13
        working-directory: backend
        run: |
          rm -rf .venv
          uv sync --frozen --dev --python 3.13
      - name: Python 3.13 full suite
        working-directory: backend
        run: |
          uv run --frozen pytest --junitxml=/tmp/junit-313.xml --cov-report=term-missing --cov-report=xml:/tmp/coverage-313.xml
      - name: Validate shell and UI
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 "$file" || true)"
            case "$first_line" in
              *bash*) bash -n "$file";;
              *"/sh"*) dash -n "$file";;
            esac
          done < <(git ls-files -z)
          node --check live/config/includes.chroot/usr/share/ares/platform/app.js
          node --check live/config/includes.chroot/usr/share/ares/platform/storage.js
          node --check live/config/includes.chroot/usr/share/ares/platform/backup.js
          node --check live/config/includes.chroot/usr/share/ares/platform/filesystem.js
      - name: Write exact two-version validation record
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def stats(version: str) -> tuple[int, int, int, int, float]:
              root = ET.parse(f'/tmp/junit-{version}.xml').getroot()
              cov = ET.parse(f'/tmp/coverage-{version}.xml').getroot()
              return (
                  int(root.attrib.get('tests', 0)),
                  int(root.attrib.get('failures', 0)),
                  int(root.attrib.get('errors', 0)),
                  int(root.attrib.get('skipped', 0)),
                  float(cov.attrib['line-rate']) * 100,
              )

          s312 = stats('312')
          s313 = stats('313')
          text = f'''# Filesystem Recovery & Repair — release validation

          This record is generated only after every release-verification gate succeeds.

          | Runtime | Tests | Failures | Errors | Skipped | Global line coverage |
          | --- | ---: | ---: | ---: | ---: | ---: |
          | Python 3.12 | {s312[0]} | {s312[1]} | {s312[2]} | {s312[3]} | {s312[4]:.2f}% |
          | Python 3.13 | {s313[0]} | {s313[1]} | {s313[2]} | {s313[3]} | {s313[4]:.2f}% |

          Additional gates: Ruff format PASS; Ruff lint PASS; strict mypy PASS; package build PASS; shell syntax PASS; app/storage/backup/filesystem JavaScript syntax PASS.

          The full pytest suite contains the isolated real ext4-image repair test. It never targets a physical disk or loop device and skips only if its declared fixture tools are unavailable on the runner.
          '''
          Path('docs/capabilities/filesystem-repair-validation.md').write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflows and publish validated changes
        run: |
          rm -f .github/workflows/filesystem-maintenance.yml
          rm -f .github/workflows/filesystem-finalize.yml
          rm -f .github/workflows/filesystem-release-verification.yml
          git config user.name "ARES Release Verification"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "filesystem: publish verified recovery repair increment"
            git pull --rebase origin agent/filesystem-recovery-repair
            git push origin HEAD:agent/filesystem-recovery-repair
          fi
      - name: Mark PR ready only after every gate passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 4 --repo wowito68/ARES-Autonomous-Recovery-and-Expert-System-
