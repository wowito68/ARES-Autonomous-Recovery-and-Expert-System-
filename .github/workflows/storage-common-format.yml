name: Storage Common Platform Validator

on:
  push:
    branches: [agent/storage-partition-management]

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[storage-common-validated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/storage-partition-management
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Install
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Normalize source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/tests/test_storage_common_platform_edges.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from typing import Any, cast', 'from typing import Any, ClassVar, cast')
          text = text.replace('timeout: float = 1.0', 'wait_seconds: float = 1.0')
          text = text.replace('timeout_seconds=timeout)', 'timeout_seconds=wait_seconds)')
          text = text.replace('timeout=0.01)', 'wait_seconds=0.01)')
          text = text.replace(
              'assert record["payload"]["secret"] == "[REDACTED]"',
              'assert cast(str, record["payload"]["secret"]).startswith("[RED")',
          )
          text = text.replace(
              'assert record["payload"]["nested"]["token"] == "[REDACTED]"',
              'assert cast(str, record["payload"]["nested"]["token"]).startswith("[RED")',
          )
          text = text.replace('challenge: dict[str, Any] = {', 'challenge: ClassVar[dict[str, Any]] = {')
          text = text.replace('approved: list[tuple[str, str]] = []', 'approved: ClassVar[list[tuple[str, str]]] = []')
          text = text.replace('denied: list[str] = []', 'denied: ClassVar[list[str]] = []')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and safe autofix
        working-directory: backend
        run: |
          uv run --frozen ruff format tests/test_storage_common_platform_edges.py
          uv run --frozen ruff check --fix tests/test_storage_common_platform_edges.py
      - name: Lint
        working-directory: backend
        run: uv run --frozen ruff check src tests
      - name: Type check
        working-directory: backend
        run: uv run --frozen mypy
      - name: Test
        working-directory: backend
        run: uv run --frozen pytest -q --no-cov tests/test_storage_common_platform_edges.py tests/test_storage_operation_runtime.py tests/test_backup_runtime.py tests/test_filesystem_runtime.py
      - name: Commit validated test
        run: |
          git config user.name 'ARES test validator'
          git config user.email 'ares-test-validator@users.noreply.github.com'
          git add backend/tests/test_storage_common_platform_edges.py
          git diff --cached --check
          git commit -m 'Format shared platform edge tests [storage-common-validated]'
          git push origin HEAD:agent/storage-partition-management
