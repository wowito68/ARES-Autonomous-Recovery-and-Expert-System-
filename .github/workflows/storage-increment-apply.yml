name: Apply Storage Partition Increment

on:
  push:
    branches:
      - agent/storage-partition-management

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[storage-integrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: agent/storage-partition-management
          fetch-depth: 0

      - name: Verify and materialize staged increment
        shell: bash
        run: |
          set -euo pipefail
          chunks=(scripts/storage_bundle.b64.00 scripts/storage_bundle.b64.01 scripts/storage_bundle.b64.02 scripts/storage_bundle.b64.03 scripts/storage_bundle.b64.04 scripts/storage_bundle.b64.05 scripts/storage_bundle.b64.06 scripts/storage_bundle.b64.07)
          expected=(8000 8000 8000 8000 8000 8000 8000 7344)
          for i in "${!chunks[@]}"; do
            test -f "${chunks[$i]}"
            actual="$(wc -c < "${chunks[$i]}")"
            test "$actual" -eq "${expected[$i]}"
          done
          cat "${chunks[@]}" | base64 -d > /tmp/storage_bundle.tgz
          echo 'aabaf3828846e4496f694d2208cfdcef7b4d5e5c8f635a749393187c1e767b02  /tmp/storage_bundle.tgz' | sha256sum -c -
          tar -xzf /tmp/storage_bundle.tgz -C .
          rm -rf backend/src/ares/storage_operations/__pycache__
          test "$(wc -c < scripts/storage_patch.b64)" -eq 7756
          echo '81607001e9be9d4b0937389d27495ddef580f18f303fba562b9c3846110c86e8  scripts/storage_patch.b64' | sha256sum -c -
          base64 -d scripts/storage_patch.b64 | gzip -dc > scripts/storage_increment_apply.py
          python3 scripts/storage_increment_apply.py

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend

      - name: Install locked development dependencies
        working-directory: backend
        run: uv sync --frozen --dev

      - name: Format generated Python and validate syntax
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          uv run --frozen ruff format src tests
          python -m compileall -q src tests
          cd ..
          node --check live/config/includes.chroot/usr/share/ares/platform/partition.js

      - name: Commit implementation without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/storage_bundle.b64.00 scripts/storage_bundle.b64.01 scripts/storage_bundle.b64.02 scripts/storage_bundle.b64.03 scripts/storage_bundle.b64.04 scripts/storage_bundle.b64.05 scripts/storage_bundle.b64.06 scripts/storage_bundle.b64.07
          rm -f scripts/storage_bundle.b64.rest scripts/storage_patch.b64 scripts/storage_increment_apply.py
          git restore --source=HEAD -- .github/workflows/backend-ci.yml .github/workflows/storage-increment-apply.yml
          git config user.name 'ARES storage integrator'
          git config user.email 'ares-storage-integrator@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing workflow mutation from integration token' >&2
            exit 1
          fi
          git commit -m 'Implement Storage & Partition Management [storage-integrated]'
          git push origin HEAD:agent/storage-partition-management
