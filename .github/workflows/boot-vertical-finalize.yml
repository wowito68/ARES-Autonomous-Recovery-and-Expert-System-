name: Boot Vertical Integrator

on:
  push:
    branches:
      - agent/boot-recovery-management

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/boot-recovery-management
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.14
          python-version: '3.12'
          working-directory: backend

      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen --dev

      - name: Apply Boot vertical integration
        run: |
          python3 scripts/boot_vertical_finalize.py
          python3 scripts/boot_vertical_postfix.py

      - name: Format and lint
        working-directory: backend
        run: |
          uv run --frozen ruff check --fix src tests
          uv run --frozen ruff format src tests
          uv run --frozen ruff format --check src tests
          uv run --frozen ruff check src tests

      - name: Strict typecheck
        working-directory: backend
        run: uv run --frozen mypy

      - name: Boot and platform tests
        working-directory: backend
        run: >-
          uv run --frozen pytest -q --no-cov
          tests/test_boot_tools.py
          tests/test_boot_engine.py
          tests/test_boot_platform_integration.py
          tests/test_capabilities_v2.py
          tests/test_storage_common_platform_edges.py

      - name: Validate Boot UI syntax
        run: node --check live/config/includes.chroot/usr/share/ares/platform/boot.js

      - name: Commit validated Boot vertical slice and remove integrator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/boot-vertical-finalize.yml scripts/boot_vertical_finalize.py scripts/boot_vertical_postfix.py
          git add backend live .github/workflows/backend-ci.yml
          git diff --cached --check
          git commit -m 'Integrate Boot Recovery vertical slice'
          git push origin HEAD:agent/boot-recovery-management
