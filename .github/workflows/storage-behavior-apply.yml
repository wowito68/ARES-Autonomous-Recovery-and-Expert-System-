name: Storage Behavior Apply

on:
  push:
    branches: [agent/storage-partition-management]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[behavior-fixed]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/storage-partition-management
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Apply focused patch
        run: python3 scripts/storage_behavior_patch.py
      - name: Validate quality
        working-directory: backend
        run: |
          uv run --frozen ruff format src tests
          uv run --frozen ruff check src tests
          uv run --frozen mypy
      - name: Validate focused regressions
        working-directory: backend
        run: |
          uv run --frozen pytest -q --no-cov \
            tests/test_capabilities_v2.py::test_disk_analysis_flows_through_catalog_workflow_events_and_graph \
            tests/test_filesystem_vertical_slice.py::test_reasoning_can_select_repair_but_cannot_supply_a_device \
            tests/test_filesystem_vertical_slice.py::test_api_executes_exact_protected_image_and_projects_before_after \
            tests/test_filesystem_real_image.py::test_real_ext4_image_is_detected_repaired_and_verified
      - name: Commit validated code changes
        run: |
          git config user.name 'ARES behavior fixer'
          git config user.email 'ares-behavior-fixer@users.noreply.github.com'
          git add backend
          git diff --cached --check
          git commit -m 'Fix storage integration regressions [behavior-fixed]'
          git push origin HEAD:agent/storage-partition-management
