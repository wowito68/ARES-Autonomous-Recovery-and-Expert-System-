name: Boot Stabilizer

on:
  push:
    branches:
      - agent/boot-recovery-management

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/boot-recovery-management
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.14
          python-version: '3.12'
          working-directory: backend

      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen --dev

      - name: Apply scoped Boot lint fixes
        run: python3 scripts/boot_stabilize.py

      - name: Format and lint
        working-directory: backend
        run: |
          uv run --frozen ruff check --fix src tests
          uv run --frozen ruff format src tests
          uv run --frozen ruff format --check src tests
          uv run --frozen ruff check src tests

      - name: Strict typecheck
        working-directory: backend
        run: uv run --frozen mypy

      - name: Boot focused tests
        working-directory: backend
        run: uv run --frozen pytest -q --no-cov tests/test_boot_tools.py tests/test_boot_engine.py

      - name: Commit validated Boot core and remove stabilizer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/boot-stabilize.yml scripts/boot_stabilize.py
          git add backend/src backend/tests
          git diff --cached --check
          git commit -m 'Stabilize Boot Recovery core'
          git push origin HEAD:agent/boot-recovery-management
