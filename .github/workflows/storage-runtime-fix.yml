name: Storage Runtime Fix

on:
  push:
    branches: [agent/storage-partition-management]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[runtime-fixed]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/storage-partition-management
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Apply runtime fix
        run: python3 scripts/storage_runtime_fix.py
      - name: Validate runtime fix
        working-directory: backend
        run: |
          uv run --frozen ruff format src tests
          uv run --frozen ruff check src tests
          uv run --frozen mypy
          uv run --frozen pytest -q --no-cov tests/test_storage_operation_api.py tests/test_storage_operation_core.py tests/test_storage_partition_real_image.py
      - name: Commit validated code-only runtime fix
        run: |
          git config user.name 'ARES runtime fixer'
          git config user.email 'ares-runtime-fixer@users.noreply.github.com'
          git add backend
          git diff --cached --check
          git commit -m 'Fix storage post-write verification [runtime-fixed]'
          git push origin HEAD:agent/storage-partition-management
