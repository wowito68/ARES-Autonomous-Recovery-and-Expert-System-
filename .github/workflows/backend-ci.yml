name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Produce Ruff-formatted diagnostic copy
        run: |
          uv run --frozen ruff format src tests
          tar -czf /tmp/ruff-formatted.tgz src tests

      - name: Upload formatted diagnostic copy
        uses: actions/upload-artifact@v4
        with:
          name: ruff-formatted-${{ github.sha }}
          path: /tmp/ruff-formatted.tgz
          retention-days: 1

      - name: Enforce Ruff
        run: uv run --frozen ruff check src tests

      - name: Enforce strict mypy
        run: uv run --frozen mypy

      - name: Build package
        run: uv build

  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          python-version: ${{ matrix.python-version }}
          working-directory: backend

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Run tests with coverage gate
        run: >-
          uv run --frozen pytest
          --junitxml=test-results-${{ matrix.python-version }}.xml
          --cov-report=term-missing
          --cov-report=xml:coverage-${{ matrix.python-version }}.xml

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            backend/test-results-${{ matrix.python-version }}.xml
            backend/coverage-${{ matrix.python-version }}.xml
          if-no-files-found: ignore
          retention-days: 1

  static-syntax:
    name: Shell and UI syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate tracked shell scripts
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 "$file" || true)"
            case "$first_line" in
              *bash*)
                bash -n "$file"
                checked=$((checked + 1))
                ;;
              *"/sh"*)
                dash -n "$file"
                checked=$((checked + 1))
                ;;
            esac
          done < <(git ls-files -z)
          echo "Validated ${checked} tracked shell scripts."

      - name: Validate platform JavaScript syntax
        run: |
          node --check live/config/includes.chroot/usr/share/ares/platform/app.js
          node --check live/config/includes.chroot/usr/share/ares/platform/storage.js
