                  1,
              )
              tools = tools.replace(
                  '            "size_bytes": size,\n        }\n',
                  '            "size_bytes": size,\n            "read_only": read_only,\n        }\n',
                  1,
              )
              tools = tools.replace(
                  '            block_device=block,\n            fingerprint_sha256=fingerprint,\n',
                  '            block_device=block,\n            read_only=read_only,\n            fingerprint_sha256=fingerprint,\n',
                  1,
              )
          old_revalidate = '''    async def revalidate(self, expected: DeviceIdentity) -> DeviceIdentity:
        current = await self.identify(expected.requested_path)
        if current.fingerprint_sha256 != expected.fingerprint_sha256:
            raise FilesystemToolError("FILESYSTEM_DEVICE_IDENTITY_CHANGED")
        return current
'''
          if old_revalidate in tools:
              tools = tools.replace(
                  old_revalidate,
                  '''    async def revalidate(self, expected: DeviceIdentity) -> DeviceIdentity:
        try:
            current = await self.identify(expected.requested_path)
        except FilesystemToolError as exc:
            if exc.code == "FILESYSTEM_TARGET_NOT_FOUND":
                raise FilesystemToolError("FILESYSTEM_DEVICE_DISAPPEARED") from exc
            raise
        if current.fingerprint_sha256 != expected.fingerprint_sha256:
            raise FilesystemToolError("FILESYSTEM_DEVICE_IDENTITY_CHANGED")
        return current
''',
                  1,
              )
          if "def _boolean(value: object) -> bool | None:" not in tools:
              tools += '''


def _boolean(value: object) -> bool | None:
