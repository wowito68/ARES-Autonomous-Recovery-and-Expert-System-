      - name: Write known-good real ext4 image integration test
        run: |
          cat > backend/tests/test_filesystem_real_image.py <<'PY'
          from __future__ import annotations

          import asyncio
          import shutil
          from pathlib import Path
          from typing import Any

          import pytest

          from ares.filesystems.executor import LocalTestFilesystemExecutor
          from ares.filesystems.integrity import repair_plan_fingerprint
          from ares.filesystems.models import (
              FilesystemHealth,
              FilesystemRepairPlan,
              FilesystemType,
              MountSafetyReport,
              RepairAction,
          )
          from ares.protection import ProtectionCheckpoint, ProtectionCheckpointStatus
          from ares.tools.filesystem import FilesystemToolSuite, MountSafetyChecker
          from ares.tools.storage import SafeProcessRunner

          REQUIRED_TOOLS = ("mkfs.ext4", "debugfs", "e2fsck", "blkid")


          def _create_image(path: Path) -> None:
              with path.open("wb") as handle:
                  handle.truncate(32 * 1024 * 1024)


          def test_real_ext4_image_is_detected_repaired_and_verified(tmp_path: Path) -> None:
              missing = [tool for tool in REQUIRED_TOOLS if shutil.which(tool) is None]
              if missing:
                  pytest.skip("isolated ext4 tools unavailable: " + ",".join(missing))
              image = tmp_path / "corrupted-ext4.img"
              _create_image(image)

              async def scenario() -> None:
                  runner = SafeProcessRunner()
                  created = await runner.run(
                      "mkfs.ext4", ("-F", "-q", str(image)), timeout_seconds=60
                  )
                  assert created.exit_code == 0
                  corrupted = await runner.run(
                      "debugfs",
                      (
                          "-w",
                          "-R",
                          "set_super_value free_blocks_count 1",
                          str(image),
                      ),
                      timeout_seconds=60,
                  )
                  assert corrupted.exit_code == 0
                  tools = FilesystemToolSuite(
                      runner=runner,
                      mount_checker=MountSafetyChecker(scan_processes=False),
                      allow_regular_file_targets=True,
                  )
                  executor = LocalTestFilesystemExecutor(tools)
                  inspection = await executor.inspect(str(image))
                  assert inspection.filesystem is FilesystemType.EXT4
                  assert inspection.health is FilesystemHealth.INCONSISTENT
                  resource_id = f"filesystem:{inspection.identity.fingerprint_sha256}"
                  checkpoint = ProtectionCheckpoint(
                      status=ProtectionCheckpointStatus.READY,
                      protected_resources=(resource_id,),
                      resource_fingerprints={resource_id: inspection.identity.fingerprint_sha256},
                      provider_capability_id="backup.create",
                      backup_id="real-image-backup-12345678",
                      verification_id="real-image-verification-12345678",
                      session_id="real-image-session-123",
                      evidence_sha256="e" * 64,
                      limitations=("synthetic checkpoint for isolated image fixture",),
                  )
                  draft = FilesystemRepairPlan(
                      session_id="real-image-session-123",
                      target=inspection.identity,
                      filesystem=FilesystemType.EXT4,
                      mount=MountSafetyReport(
                          mounted=False,
                          busy=False,
                          swap=False,
                          safe_to_unmount=False,
                          safe_to_remount=False,
                      ),
                      detected_problems=inspection.check.problems if inspection.check else (),
                      evidence=inspection.check.evidence if inspection.check else (),
                      required_tools=inspection.required_tools,
                      required_permissions=("block-device.readwrite",),
                      protection_checkpoint=checkpoint,
                      repair_actions=(
                          RepairAction(
                              id="filesystem.repair",
                              description="Repair only isolated ext4 image",
                              mutates_target=True,
                          ),
                      ),
                      verification_steps=("Run e2fsck -f -n after repair",),
                      rollback_strategy="Discardable image; no physical device",
                      executable=True,
                      fingerprint_sha256="0" * 64,
                  )
                  plan = draft.model_copy(
                      update={"fingerprint_sha256": repair_plan_fingerprint(draft)}
                  )
                  challenges: list[str] = []

                  async def challenge(value: str) -> None:
                      challenges.append(value)

                  grant = await executor.request_authorization(
                      plan, on_challenge=challenge
                  )
                  stages: list[str] = []

                  async def stage(name: str, payload: dict[str, Any]) -> None:
                      del payload
                      stages.append(name)

                  outcome = await executor.execute(plan, grant, on_stage=stage)
                  assert challenges
                  assert outcome.before.health is FilesystemHealth.INCONSISTENT
                  assert outcome.repair_tool == "e2fsck"
                  assert outcome.repair_exit_code in {0, 1, 2}
                  assert outcome.after.health is FilesystemHealth.HEALTHY
                  assert "filesystem.repair-command.started" in stages
                  assert "filesystem.verification.completed" in stages

              asyncio.run(scenario())
          PY
      - name: Finalize docs and permanent Backend CI
        run: |
          mkdir -p docs/capabilities docs/adr
          cat > docs/capabilities/filesystem-repair.md <<'EOF'
          # Filesystem Recovery & Repair

          `filesystem.repair@1.0.0` is ARES' first high-risk filesystem metadata mutation. The enforced sequence is Detect → Protect → Plan → Authorize → Execute → Verify. FastAPI and the LLM never receive raw-device write primitives, executable names or argv.

          Automated repair adapters: ext2/ext3/ext4 (`e2fsck -f -n` then conservative `-p`, never `-y`); XFS (`xfs_repair -n` then `xfs_repair`, never `-L`); limited NTFS (`ntfsfix -n`/`ntfsfix`, classified PARTIAL after mutation). Btrfs is inspect/read-only-check only; `btrfs check --repair` is not automated.

          Device identity is fingerprinted from canonical target, major/minor, filesystem UUID, PARTUUID, serial/model when available, size and kernel read-only evidence. Production targets must remain within `/dev`; regular files are enabled only for isolated tests.

          MountSafetyChecker blocks automatic unmount for active swap, multiple/bind/nested mounts, active process cwd/root/exe/fd references, or options ARES cannot restore safely. There is no force-unmount path. Previously mounted filesystems remount only after healthy verification.

          ProtectionCheckpoint is durable, session/resource/fingerprint-bound and broker-reloaded. The current provider promotes only a COMPLETED + VERIFIED backup of the full filesystem mount point on the matching device. It is file-level recovery evidence, not block/metadata rollback.

          Consent is independent, expiring and one-use. The operator must type `I understand that this operation modifies the filesystem. APPROVE <plan-prefix>`. The grant binds session, plan, repair and exact target fingerprint.

          Cancellation is allowed before the destructive phase; ARES does not force-kill a running metadata repair. Post-check determines SUCCESS/PARTIAL/FAILED/UNKNOWN; exit code alone never declares success. Crash/power-loss reconciliation marks nonterminal records ABORTED with no verification claim.
          EOF
          cat > docs/adr/0010-filesystem-repair-privilege-and-verification-boundary.md <<'EOF'
          # ADR-0010: Filesystem repair privilege and verification boundary

          ## Status
          Accepted.

          ## Decision
          FastAPI remains unprivileged and `PrivateDevices=yes`. `ares-tool-broker` alone owns raw-device effects and mount management and therefore receives CAP_SYS_ADMIN, while retaining peer-UID checks, network denial and systemd confinement. Requests are semantic and typed; callers cannot choose shell, binary or argv. The broker independently validates plan SHA-256, reloads the durable exact-resource ProtectionCheckpoint, revalidates device identity/mount state before authorization and before execution, requires independent one-use consent, writes Audit Ledger intent before effects, and accepts success only after structured post-repair verification.

          No force-unmount, ext `-y`, XFS `-L`, Btrfs `--repair`, or metadata rollback is exposed. CAP_SYS_ADMIN remains broad TCB debt; a narrower future mount helper is desirable.
          EOF
