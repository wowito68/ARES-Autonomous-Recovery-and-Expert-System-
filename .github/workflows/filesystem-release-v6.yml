                  "class MountSafetyChecker:\n",
                  "class MountSafetyProvider(Protocol):\n    def inspect(self, identity: DeviceIdentity) -> MountSafetyReport: ...\n\n\nclass MountSafetyChecker:\n",
                  1,
              )
          tools = tools.replace(
              "        mount_checker: MountSafetyChecker | None = None,\n",
              "        mount_checker: MountSafetyProvider | None = None,\n",
              1,
          )
          if "detect_runtime_os," not in tools:
              tools = tools.replace(
                  "    ToolRequirement,\n)",
                  "    ToolRequirement,\n    detect_runtime_os,\n)",
                  1,
              )
          tools = tools.replace(
              "                identity=identity,\n                mount=mount,",
              "                identity=identity,\n                runtime_os=detect_runtime_os(),\n                mount=mount,",
          )
          tools = tools.replace(
              "            identity=identity,\n            filesystem=filesystem,",
              "            identity=identity,\n            runtime_os=detect_runtime_os(),\n            filesystem=filesystem,",
          )
          tools = tools.replace(
              '        writable = await asyncio.to_thread(os.access, identity.canonical_path, os.W_OK)\n',
              '        writable = (\n            await asyncio.to_thread(os.access, identity.canonical_path, os.W_OK)\n            and identity.read_only is not True\n        )\n',
              1,
          )
          tools = tools.replace(
              '"MAJ:MIN,PATH,TYPE,SIZE,FSTYPE,UUID,PARTUUID,SERIAL,MODEL,MOUNTPOINTS",',
              '"MAJ:MIN,PATH,TYPE,SIZE,RO,FSTYPE,UUID,PARTUUID,SERIAL,MODEL,MOUNTPOINTS",',
              1,
          )
          if 'read_only = _boolean(lsblk.get("ro"))' not in tools:
              tools = tools.replace(
                  '        size = _integer(lsblk.get("size"), info.st_size if not block else 0)\n',
