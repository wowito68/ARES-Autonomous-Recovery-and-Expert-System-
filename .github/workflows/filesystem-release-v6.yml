              "docs/security.md": "## Filesystem repair defense in depth\nExact identity includes canonical target, major/minor, filesystem UUID, PARTUUID, available serial/model/size and read-only evidence. Repair requires MountSafetyChecker, durable checkpoint reload, one-use consent, broker revalidation, post-check and audit. FastAPI remains PrivateDevices=yes. Broker CAP_SYS_ADMIN is documented TCB debt; no bypass exists.",
              "docs/agent-and-tools.md": "## Filesystem repair orchestration\nThe Agent can recognize repair intent but cannot submit device, command, tool or argv to filesystem.repair. It must inspect an explicit target and ask when multiple targets are plausible. Adapters alone own fixed filesystem-tool invocations.",
              "docs/data.md": "## Filesystem repair records\nARES persists inspections, RepairPlans, executions, RepairVerification and exact-resource ProtectionCheckpoints. Audit stores target identity, fixed tool/safe arguments, operator, checkpoint, timestamps and structured result; never file contents, credentials, secrets or tokens.",
              "docs/api.md": "## Filesystem repair API\nPOST /filesystems/inspect; POST /filesystems/repair/plan; POST /filesystems/repair; GET /filesystems/repairs/{id}; GET /filesystems/repairs/{id}/verification; POST /filesystems/repairs/{id}/cancel. Multi-request high-risk flows preserve X-ARES-Session-ID; X-Request-ID remains per-request correlation.",
              "docs/roadmap.md": "## Filesystem Recovery & Repair increment\nImplemented ext-family/XFS repair, limited NTFS repair, Btrfs inspection-only, exact identity/read-only evidence, mount safety, verified checkpoint, independent authorization, broker isolation, post-verification, API/CLI/frontend/Agent, Knowledge Graph and Audit. Recommended next: verified backup.restore plus snapshot/block-image ProtectionCheckpoint providers.",
