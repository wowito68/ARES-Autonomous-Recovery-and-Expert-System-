name: Storage Test Format

on:
  push:
    branches: [agent/storage-partition-management]

permissions:
  contents: write

jobs:
  format-and-validate:
    if: "!contains(github.event.head_commit.message, '[storage-tests-formatted]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/storage-partition-management
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Format test
        working-directory: backend
        run: uv run --frozen ruff format tests/test_storage_operation_runtime.py
      - name: Lint
        working-directory: backend
        run: uv run --frozen ruff check src tests
      - name: Type check
        working-directory: backend
        run: uv run --frozen mypy
      - name: Test storage runtime
        working-directory: backend
        run: uv run --frozen pytest -q --no-cov tests/test_storage_operation_runtime.py tests/test_storage_operation_api.py tests/test_storage_operation_core.py tests/test_storage_partition_real_image.py
      - name: Commit formatted test
        run: |
          git config user.name 'ARES test formatter'
          git config user.email 'ares-test-formatter@users.noreply.github.com'
          git add backend/tests/test_storage_operation_runtime.py
          git diff --cached --check
          git commit -m 'Format storage runtime coverage tests [storage-tests-formatted]'
          git push origin HEAD:agent/storage-partition-management
