name: Backup slice maintenance cleanup

on:
  push:
    branches:
      - agent/backup-snapshot-manager

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/backup-snapshot-manager
          fetch-depth: 0

      - name: Wait for maintenance commit
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            git pull --ff-only origin agent/backup-snapshot-manager
            if grep -q "Backup & Snapshot Manager increment" docs/architecture.md \
              && grep -q "ruff format --check src tests" .github/workflows/backend-ci.yml \
              && grep -q 'script src="/backup.js"' live/config/includes.chroot/usr/share/ares/platform/index.html; then
              exit 0
            fi
            sleep 10
          done
          echo "Maintenance conditions were not satisfied; refusing cleanup." >&2
          exit 1

      - name: Remove temporary workflows
        run: |
          set -euo pipefail
          git rm .github/workflows/backup-slice-maintenance.yml
          git rm .github/workflows/backup-slice-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary backup maintenance workflows"
          git push origin HEAD:agent/backup-snapshot-manager
