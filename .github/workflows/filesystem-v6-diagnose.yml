name: Diagnose Filesystem Release V6

on:
  push:
    branches:
      - agent/filesystem-recovery-repair
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Record exact V6 failed step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 15
          run_id="$(gh run list --repo wowito68/ARES-Autonomous-Recovery-and-Expert-System- --workflow filesystem-release-v6.yml --branch agent/filesystem-recovery-repair --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          status="$(gh run view "$run_id" --repo wowito68/ARES-Autonomous-Recovery-and-Expert-System- --json status --jq '.status')"
          if [ "$status" != "completed" ]; then
            gh run watch "$run_id" --repo wowito68/ARES-Autonomous-Recovery-and-Expert-System- || true
          fi
          failed="$(gh run view "$run_id" --repo wowito68/ARES-Autonomous-Recovery-and-Expert-System- --json jobs --jq '[.jobs[].steps[] | select(.conclusion == "failure") | .name][0] // "unknown-failure"')"
          slug="$(printf '%s' "$failed" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')"
          mkdir -p .ci-diagnostics
          rm -f .ci-diagnostics/v6-failed-*
          printf 'run_id=%s\nfailed_step=%s\n' "$run_id" "$failed" > ".ci-diagnostics/v6-failed-${slug}.txt"
          gh run view "$run_id" --repo wowito68/ARES-Autonomous-Recovery-and-Expert-System- --log-failed > .ci-diagnostics/v6-failed.log || true
          git config user.name "ARES CI Diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add .ci-diagnostics
          git commit -m "ci: record filesystem V6 failure gate"
          git push origin HEAD:agent/filesystem-recovery-repair
