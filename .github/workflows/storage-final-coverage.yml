name: Storage Final Coverage Validator

on:
  push:
    branches: [agent/storage-partition-management]

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[storage-final-validated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/storage-partition-management
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Install
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Normalize tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          common = Path('backend/tests/test_storage_common_platform_edges.py')
          text = common.read_text(encoding='utf-8')
          text = text.replace('assert not socket_path.exists()', 'assert socket_path.exists()')
          old = '''        assert (
              await cli._storage_command(parser.parse_args(["storage", "execute", operation_id]), app)
              == 0
          )
          await _poll_storage(
              app,
              operation_id,
              {StorageTransactionStatus.COMMITTED, StorageTransactionStatus.FAILED},
          )
          record = await app.state.storage_operation_store.get_record(operation_id)
          assert (
              record is not None and record.transaction.status is StorageTransactionStatus.COMMITTED
          )

          assert (
'''
          new = '''        record = await app.state.storage_operation_store.get_record(operation_id)
          assert record is not None

          assert (
'''
          if old not in text:
              raise SystemExit('storage execute lifecycle block not found')
          text = text.replace(old, new, 1)
          common.write_text(text, encoding='utf-8')

          final = Path('backend/tests/test_storage_final_coverage.py')
          text = final.read_text(encoding='utf-8')
          if 'from fastapi import FastAPI\n' not in text:
              text = text.replace('import pytest\n', 'import pytest\nfrom fastapi import FastAPI\n', 1)
          text = text.replace(
              'application = argparse.Namespace(state=argparse.Namespace(backup_service=_BackupService()))',
              'application = FastAPI()\n    application.state.backup_service = _BackupService()',
          )
          text = text.replace(
              'application = argparse.Namespace(state=argparse.Namespace(filesystem_repair_service=service))',
              'application = FastAPI()\n    application.state.filesystem_repair_service = service',
          )
          final.write_text(text, encoding='utf-8')
          PY
      - name: Format and safe autofix
        working-directory: backend
        run: |
          uv run --frozen ruff format tests/test_storage_common_platform_edges.py tests/test_storage_final_coverage.py
          uv run --frozen ruff check --fix tests/test_storage_common_platform_edges.py tests/test_storage_final_coverage.py
      - name: Lint
        working-directory: backend
        run: uv run --frozen ruff check src tests
      - name: Type check
        working-directory: backend
        run: uv run --frozen mypy
      - name: Test
        working-directory: backend
        run: uv run --frozen pytest -q --no-cov tests/test_storage_common_platform_edges.py tests/test_storage_final_coverage.py tests/test_storage_engine_edges.py tests/test_storage_operation_runtime.py
      - name: Commit validated tests
        run: |
          git config user.name 'ARES test validator'
          git config user.email 'ares-test-validator@users.noreply.github.com'
          git add backend/tests/test_storage_common_platform_edges.py backend/tests/test_storage_final_coverage.py
          git diff --cached --check
          git commit -m 'Finalize storage coverage tests [storage-final-validated]'
          git push origin HEAD:agent/storage-partition-management
