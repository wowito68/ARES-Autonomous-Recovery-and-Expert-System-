name: Sequence Filesystem V6 Python Failure

on:
  push:
    branches:
      - agent/filesystem-recovery-repair
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Mark completed subgates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 10
          run_id="$(gh run list --repo wowito68/ARES-Autonomous-Recovery-and-Expert-System- --workflow filesystem-release-v6.yml --branch agent/filesystem-recovery-repair --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run view "$run_id" --repo wowito68/ARES-Autonomous-Recovery-and-Expert-System- --log-failed > /tmp/v6.log
          mkdir -p .ci-diagnostics
          rm -f .ci-diagnostics/v6-seq-*.txt
          count="$(grep -c 'All checks passed!' /tmp/v6.log || true)"
          [ "$count" -ge 1 ] && printf '%s\n' "$count" > .ci-diagnostics/v6-seq-ruff-success-count.txt || true
          grep -q 'Success: no issues found' /tmp/v6.log && touch .ci-diagnostics/v6-seq-mypy-success.txt || true
          grep -Eq 'Built ares-backend|Successfully built|Building source distribution|Building wheel' /tmp/v6.log && touch .ci-diagnostics/v6-seq-build-reached.txt || true
          grep -Eq 'test session starts|collected [0-9]+ items' /tmp/v6.log && touch .ci-diagnostics/v6-seq-pytest-reached.txt || true
          git config user.name "ARES CI Diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add .ci-diagnostics
          git commit -m "ci: mark filesystem V6 completed subgates"
          git push origin HEAD:agent/filesystem-recovery-repair
