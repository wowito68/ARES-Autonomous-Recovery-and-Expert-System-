name: Filesystem Repair Maintenance

on:
  push:
    branches:
      - agent/filesystem-recovery-repair
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Apply deterministic patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "backend/tests/test_backup_vertical_slice.py",
              "async def test_backup_store_and_service_listing_are_shared(app: FastAPI, tmp_path: Path) -> None:\n",
              "async def test_backup_store_and_service_listing_are_shared(\n    client: AsyncClient, app: FastAPI, tmp_path: Path\n) -> None:\n    del client\n",
          )
          replace(
              "backend/src/ares/api/routes/filesystems.py",
              'return str(getattr(request.state, "request_id", "filesystem-session"))',
              'return str(getattr(request.state, "session_id", "filesystem-session"))',
          )
          replace(
              "backend/tests/test_filesystem_vertical_slice.py",
              'session_id="filesystem-api-request-123",',
              'session_id="filesystem-api-session-123",',
          )
          replace(
              "backend/tests/test_filesystem_vertical_slice.py",
              'session_id="filesystem-api-request-123",',
              'session_id="filesystem-api-session-123",',
          )
          replace(
              "backend/src/ares/actions/filesystem_repair.py",
              '    if plan.filesystem is FilesystemType.NTFS and outcome.repair_tool != "none":\n',
              '    if any(\n        item in outcome.limitations\n        for item in ("repair_tool_failed", "repair_tool_reported_unresolved_errors")\n    ):\n        return (\n            RepairVerificationStatus.PARTIAL,\n            "La herramienta de reparación reportó errores no resueltos; no se declara éxito total.",\n        )\n    if plan.filesystem is FilesystemType.NTFS and outcome.repair_tool != "none":\n',
          )
          replace(
              "backend/src/ares/tools/filesystem.py",
              '    async def revalidate(self, expected: DeviceIdentity) -> DeviceIdentity:\n        current = await self.identify(expected.requested_path)\n        if current.fingerprint_sha256 != expected.fingerprint_sha256:\n            raise FilesystemToolError("FILESYSTEM_DEVICE_IDENTITY_CHANGED")\n        return current\n',
              '    async def revalidate(self, expected: DeviceIdentity) -> DeviceIdentity:\n        try:\n            current = await self.identify(expected.requested_path)\n        except FilesystemToolError as exc:\n            if exc.code == "FILESYSTEM_TARGET_NOT_FOUND":\n                raise FilesystemToolError("FILESYSTEM_DEVICE_DISAPPEARED") from exc\n            raise\n        if current.fingerprint_sha256 != expected.fingerprint_sha256:\n            raise FilesystemToolError("FILESYSTEM_DEVICE_IDENTITY_CHANGED")\n        return current\n',
          )
          js = Path("live/config/includes.chroot/usr/share/ares/platform/filesystem.js")
          text = js.read_text(encoding="utf-8")
          text = text.replace(
              '  const api = "/api/v1/filesystems";\n',
              '  const api = "/api/v1/filesystems";\n  const sessionId = `ui-${globalThis.crypto.randomUUID().replaceAll("-", "")}`;\n',
              1,
          )
          text = text.replace(
              'headers: { "Content-Type": "application/json", ...(options.headers || {}) },',
              'headers: { "Content-Type": "application/json", "X-ARES-Session-ID": sessionId, ...(options.headers || {}) },',
              1,
          )
          js.write_text(text, encoding="utf-8")
          PY
      - name: Apply safe Ruff fixes and formatting
        working-directory: backend
        run: |
          uv run --frozen ruff check --fix src tests || true
          uv run --frozen ruff format src tests
      - name: Commit maintenance output
        run: |
          git config user.name "ARES CI Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src backend/tests live/config/includes.chroot/usr/share/ares/platform/filesystem.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "filesystem: normalize safety and quality contracts"
          git push origin HEAD:agent/filesystem-recovery-repair
