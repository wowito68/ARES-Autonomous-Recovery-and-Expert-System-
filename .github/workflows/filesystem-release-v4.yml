          js.write_text(js_text, encoding="utf-8")
          PY
      - name: Write isolated real ext4 integration test
        run: |
          cat > backend/tests/test_filesystem_real_image.py <<'PY'
          from __future__ import annotations

          import asyncio
          import shutil
          from pathlib import Path
          from typing import Any

          import pytest

          from ares.filesystems.executor import LocalTestFilesystemExecutor
          from ares.filesystems.integrity import repair_plan_fingerprint
          from ares.filesystems.models import (
              FilesystemHealth,
              FilesystemRepairPlan,
              FilesystemType,
              MountSafetyReport,
              RepairAction,
          )
          from ares.protection import ProtectionCheckpoint, ProtectionCheckpointStatus
          from ares.tools.filesystem import FilesystemToolSuite, MountSafetyChecker
          from ares.tools.storage import SafeProcessRunner

          REQUIRED_TOOLS = ("mkfs.ext4", "debugfs", "e2fsck", "blkid")


          def _create_image(path: Path) -> None:
              with path.open("wb") as handle:
                  handle.truncate(32 * 1024 * 1024)


          def test_real_ext4_image_is_detected_repaired_and_verified(tmp_path: Path) -> None:
              missing = [tool for tool in REQUIRED_TOOLS if shutil.which(tool) is None]
              if missing:
                  pytest.skip("isolated ext4 tools unavailable: " + ",".join(missing))
              image = tmp_path / "corrupted-ext4.img"
              _create_image(image)

              async def scenario() -> None:
                  runner = SafeProcessRunner()
                  created = await runner.run(
                      "mkfs.ext4", ("-F", "-q", str(image)), timeout_seconds=60
                  )
                  assert created.exit_code == 0
                  corrupted = await runner.run(
                      "debugfs",
                      (
                          "-w",
                          "-R",
                          "set_super_value free_blocks_count 1",
                          str(image),
                      ),
                      timeout_seconds=60,
                  )
                  assert corrupted.exit_code == 0
                  tools = FilesystemToolSuite(
                      runner=runner,
                      mount_checker=MountSafetyChecker(scan_processes=False),
                      allow_regular_file_targets=True,
                  )
                  executor = LocalTestFilesystemExecutor(tools)
                  inspection = await executor.inspect(str(image))
                  assert inspection.filesystem is FilesystemType.EXT4
                  assert inspection.health is FilesystemHealth.INCONSISTENT
                  resource_id = f"filesystem:{inspection.identity.fingerprint_sha256}"
                  checkpoint = ProtectionCheckpoint(
                      status=ProtectionCheckpointStatus.READY,
                      protected_resources=(resource_id,),
                      resource_fingerprints={
                          resource_id: inspection.identity.fingerprint_sha256
                      },
                      provider_capability_id="backup.create",
                      backup_id="real-image-backup-12345678",
                      verification_id="real-image-verification-12345678",
                      session_id="real-image-session-123",
                      evidence_sha256="e" * 64,
                      limitations=("synthetic checkpoint for isolated image fixture",),
                  )
                  draft = FilesystemRepairPlan(
                      session_id="real-image-session-123",
                      target=inspection.identity,
                      filesystem=FilesystemType.EXT4,
                      mount=MountSafetyReport(
                          mounted=False,
                          busy=False,
                          swap=False,
                          safe_to_unmount=False,
                          safe_to_remount=False,
                      ),
                      detected_problems=(
                          inspection.check.problems if inspection.check else ()
                      ),
                      evidence=inspection.check.evidence if inspection.check else (),
                      required_tools=inspection.required_tools,
                      required_permissions=("block-device.readwrite",),
                      protection_checkpoint=checkpoint,
                      repair_actions=(
                          RepairAction(
                              id="filesystem.repair",
                              description="Repair only isolated ext4 image",
                              mutates_target=True,
                          ),
                      ),
                      verification_steps=("Run e2fsck -f -n after repair",),
                      rollback_strategy="Discardable image; no physical device",
                      executable=True,
                      fingerprint_sha256="0" * 64,
                  )
                  plan = draft.model_copy(
                      update={"fingerprint_sha256": repair_plan_fingerprint(draft)}
                  )
                  challenges: list[str] = []

                  async def challenge(value: str) -> None:
                      challenges.append(value)

                  grant = await executor.request_authorization(
                      plan, on_challenge=challenge
                  )
                  stages: list[str] = []

                  async def stage(name: str, payload: dict[str, Any]) -> None:
                      del payload
                      stages.append(name)

                  outcome = await executor.execute(plan, grant, on_stage=stage)
                  assert challenges
                  assert outcome.before.health is FilesystemHealth.INCONSISTENT
                  assert outcome.repair_tool == "e2fsck"
                  assert outcome.repair_exit_code in {0, 1, 2}
                  assert outcome.after.health is FilesystemHealth.HEALTHY
                  assert "filesystem.repair-command.started" in stages
                  assert "filesystem.verification.completed" in stages

              asyncio.run(scenario())
          PY
      - name: Finalize required documentation and permanent CI
        run: |
          mkdir -p docs/capabilities docs/adr
          test -f docs/capabilities/filesystem-repair.md || cat > docs/capabilities/filesystem-repair.md <<'EOF'
          # Filesystem Recovery & Repair
          `filesystem.repair@1.0.0` is high-risk, mutating, exact-target, ProtectionCheckpoint- and independent-authorization-gated. Automated repair support is ext2/ext3/ext4, XFS and limited NTFS. Btrfs is inspection/read-only-check only. There is no force-unmount, ext `-y`, XFS `-L`, Btrfs `--repair`, or metadata rollback path. Success requires structured post-repair verification.
          EOF
          test -f docs/adr/0010-filesystem-repair-privilege-and-verification-boundary.md || cat > docs/adr/0010-filesystem-repair-privilege-and-verification-boundary.md <<'EOF'
          # ADR-0010: Filesystem repair privilege and verification boundary
          Status: Accepted.
          FastAPI remains unprivileged and `PrivateDevices=yes`. The privileged broker alone owns raw-device effects and CAP_SYS_ADMIN for mount/unmount, while retaining peer-UID checks, network denial, systemd confinement, semantic fixed-policy requests, plan-hash validation, durable exact checkpoint reload, independent consent and durable audit. Running metadata repair cannot be force-cancelled. Btrfs mutation, XFS log-zeroing and metadata rollback are explicitly out of scope.
          EOF
          python - <<'PY'
          from pathlib import Path
          marker = "<!-- ARES FILESYSTEM REPAIR 1.0 FINAL -->"
          sections = {
              "docs/architecture.md": "## Filesystem Recovery & Repair\nThe high-risk path is Inspect → RepairPlan → exact durable ProtectionCheckpoint → independent consent → CapabilityManager/Workflow → privileged broker/fixed adapter → structured verification → historical Knowledge Graph and Audit. API/LLM never receive raw-device command authority.",
              "docs/security.md": "## Filesystem repair defense in depth\nExact device identity includes canonical target, major/minor, filesystem UUID, PARTUUID, available serial/model/size and read-only evidence. Repair requires mount safety, durable checkpoint reload, one-use consent, broker revalidation and post-check. FastAPI remains PrivateDevices=yes; broker CAP_SYS_ADMIN is documented TCB debt. No safety bypass is exposed.",
              "docs/agent-and-tools.md": "## Filesystem repair orchestration\nThe Agent may recognize repair intent but cannot submit device, command, tool or argv to filesystem.repair. It must resolve ambiguity by inspection/planning and ask when multiple targets are plausible. Adapters alone own fixed tool invocations.",
              "docs/data.md": "## Filesystem repair records\nARES persists inspections, immutable RepairPlans, executions, RepairVerification and exact-resource ProtectionCheckpoints. Audit records target identity, fixed tool/safe arguments, operator, checkpoint, timestamps and structured result, never file contents, credentials, secrets or tokens.",
              "docs/api.md": "## Filesystem repair API\nPOST /filesystems/inspect; POST /filesystems/repair/plan; POST /filesystems/repair; GET /filesystems/repairs/{id}; GET /filesystems/repairs/{id}/verification; POST /filesystems/repairs/{id}/cancel. Multi-request high-risk flows preserve X-ARES-Session-ID while X-Request-ID remains per-request correlation.",
              "docs/roadmap.md": "## Filesystem Recovery & Repair increment\nImplemented ext-family/XFS repair, limited NTFS repair, Btrfs inspection-only, exact identity/read-only evidence, MountSafetyChecker, verified checkpoint, independent authorization, broker isolation, verification, API/CLI/frontend/Agent, KG and audit. Next recommended increment: verified backup.restore plus snapshot/block-image checkpoint providers.",
          }
          for name, section in sections.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  path.write_text(text.rstrip() + "\n\n" + marker + "\n" + section + "\n", encoding="utf-8")
          PY
          cat > .github/workflows/backend-ci.yml <<'EOF'
          name: Backend CI

          on:
            push:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            quality:
              name: Python quality and build
              runs-on: ubuntu-latest
              timeout-minutes: 15
              defaults:
                run:
                  working-directory: backend
              steps:
                - uses: actions/checkout@v6
                  with:
                    persist-credentials: false
                - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
                  with:
                    version: "0.11.14"
                    python-version: "3.12"
                    working-directory: backend
                - run: uv sync --frozen --dev
                - run: uv run --frozen ruff format --check src tests
                - run: uv run --frozen ruff check src tests
                - run: uv run --frozen mypy
                - run: uv build

            tests:
              name: Tests / Python ${{ matrix.python-version }}
              runs-on: ubuntu-latest
              timeout-minutes: 25
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.12", "3.13"]
              defaults:
                run:
                  working-directory: backend
              steps:
                - uses: actions/checkout@v6
                  with:
                    persist-credentials: false
                - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
                  with:
                    version: "0.11.14"
                    python-version: ${{ matrix.python-version }}
                    working-directory: backend
                - run: uv sync --frozen --dev
                - run: uv run --frozen pytest --cov-report=term-missing

            static-syntax:
              name: Shell and UI syntax
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v6
                  with:
                    persist-credentials: false
                - name: Validate tracked shell scripts
                  shell: bash
                  run: |
                    set -euo pipefail
                    checked=0
                    while IFS= read -r -d '' file; do
                      first_line="$(head -n 1 "$file" || true)"
                      case "$first_line" in
                        *bash*) bash -n "$file"; checked=$((checked + 1));;
                        *"/sh"*) dash -n "$file"; checked=$((checked + 1));;
                      esac
                    done < <(git ls-files -z)
                    echo "Validated ${checked} tracked shell scripts."
                - name: Validate platform JavaScript
