name: Identify Filesystem V6 Collection Errors

on:
  push:
    branches:
      - agent/filesystem-recovery-repair
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Extract collection filenames and exception classes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 10
          run_id="$(gh run list --repo wowito68/ARES-Autonomous-Recovery-and-Expert-System- --workflow filesystem-release-v6.yml --branch agent/filesystem-recovery-repair --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run view "$run_id" --repo wowito68/ARES-Autonomous-Recovery-and-Expert-System- --log-failed > /tmp/v6.log
          mkdir -p .ci-diagnostics
          rm -f .ci-diagnostics/v6-collect-*.txt
          grep -E 'ERROR collecting ' /tmp/v6.log | sed -E 's/.*ERROR collecting ([^ ]+).*/\1/' | sort -u | while read -r file; do
            slug="$(printf '%s' "$file" | sed -E 's/[^A-Za-z0-9]+/-/g; s/^-+|-+$//g')"
            printf '%s\n' "$file" > ".ci-diagnostics/v6-collect-file-${slug}.txt"
          done
          for kind in ImportError ModuleNotFoundError AttributeError TypeError NameError SyntaxError PydanticUserError ValidationError; do
            grep -q "$kind" /tmp/v6.log && touch ".ci-diagnostics/v6-collect-exception-${kind}.txt" || true
          done
          grep -E -A25 -B5 'ERROR collecting |ImportError|ModuleNotFoundError|AttributeError|TypeError|NameError|SyntaxError|PydanticUserError|ValidationError' /tmp/v6.log > .ci-diagnostics/v6-collection-excerpt.log || true
          git config user.name "ARES CI Diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add .ci-diagnostics
          git commit -m "ci: identify filesystem pytest collection failure"
          git push origin HEAD:agent/filesystem-recovery-repair
