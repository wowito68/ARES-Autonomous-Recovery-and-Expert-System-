name: Storage Quality Fix

on:
  push:
    branches:
      - agent/storage-partition-management

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[quality-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: agent/storage-partition-management
          fetch-depth: 0

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Apply localized quality fixes
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen ruff check --fix --unsafe-fixes src tests || true
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:70]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          # Unicode punctuation in a regex-like test string is ambiguous to Ruff.
          path = Path("tests/test_backup_tools.py")
          text = path.read_text(encoding="utf-8").replace("\u2013", "-")
          path.write_text(text, encoding="utf-8")

          replace(
              "src/ares/actions/backup.py",
              'destination_id = f"backup-destination:{_id(backup.destination.device_id + backup.destination.mount_point)}"',
              'destination_identity = backup.destination.device_id + backup.destination.mount_point\n        destination_id = f"backup-destination:{_id(destination_identity)}"',
          )
          replace(
              "src/ares/actions/filesystem_repair.py",
              '"ntfsfix terminó y el check Linux no detecta errores comunes, pero Windows CHKDSK sigue siendo necesario.",',
              '(\n                "ntfsfix terminó y el check Linux no detecta errores comunes, "\n                "pero Windows CHKDSK sigue siendo necesario."\n            ),',
          )
          replace(
              "src/ares/api/routes/assistant.py",
              'Conoces la familia storage.partition.inspect/create/delete/resize/move. El Agent solo expresa estado deseado y nunca comandos, sectores calculados a ciegas ni argv. Debe identificar el disco y la partición mediante evidencia estructurada, pedir aclaración ante ambigüedad y pasar por Storage Operation Engine: plan declarativo -> identidad -> impacto de datos/boot -> dry-run -> ProtectionCheckpoint -> autorización independiente -> broker -> verificación. En este incremento create/delete solo pueden ejecutarse sobre imágenes/loop controlados; los discos físicos están bloqueados por ProductionStorageWriteGate. resize y move están diseñados pero deshabilitados; nunca afirmes que pueden ejecutarse. LVM, RAID y cifrado se detectan pero no se modifican. Un StorageTransaction UNKNOWN exige reinspección y nunca reintento automático.',
              'Conoces la familia storage.partition.inspect/create/delete/resize/move. El Agent solo expresa\nestado deseado y nunca comandos, sectores calculados a ciegas ni argv. Debe identificar el disco y\nla partición mediante evidencia estructurada, pedir aclaración ante ambigüedad y pasar por Storage\nOperation Engine: plan declarativo -> identidad -> impacto de datos/boot -> dry-run ->\nProtectionCheckpoint -> autorización independiente -> broker -> verificación. En este incremento\ncreate/delete solo pueden ejecutarse sobre imágenes/loop controlados; los discos físicos están\nbloqueados por ProductionStorageWriteGate. resize y move están diseñados pero deshabilitados; nunca\nafirmes que pueden ejecutarse. LVM, RAID y cifrado se detectan pero no se modifican. Un\nStorageTransaction UNKNOWN exige reinspección y nunca reintento automático.',
          )
          replace(
              "src/ares/capabilities/plugins/backup.py",
              'objective="Detectar corrupción, entradas ausentes o cambios de integridad sin modificar el backup.",',
              'objective=(\n            "Detectar corrupción, entradas ausentes o cambios de integridad "\n            "sin modificar el backup."\n        ),',
          )
          replace(
              "src/ares/capabilities/plugins/storage_partition.py",
              'objective="Create a partition-table entry without formatting or wiping contained signatures.",',
              'objective=(\n            "Create a partition-table entry without formatting or wiping "\n            "contained signatures."\n        ),',
          )
          replace(
              "src/ares/capabilities/plugins/storage_partition.py",
              'objective="Remove an eligible test partition table entry with verifiable before/after state.",',
              'objective=(\n            "Remove an eligible test partition table entry with verifiable "\n            "before/after state."\n        ),',
          )
          replace(
              "src/ares/capabilities/plugins/storage_partition.py",
              'description="Models grow/shrink dependencies but has no executable adapter in this increment.",',
              'description=(\n            "Models grow/shrink dependencies but has no executable adapter "\n            "in this increment."\n        ),',
          )
          replace(
              "src/ares/capabilities/plugins/storage_partition.py",
              'objective="Represent filesystem-aware partition resize safely before future implementation.",',
              'objective=(\n            "Represent filesystem-aware partition resize safely before "\n            "future implementation."\n        ),',
          )
          for old, new in (
              (
                  '"ARES usa e2fsck -p: solo corrige problemas que e2fsck considera seguros para reparación automática.",',
                  '(\n                "ARES usa e2fsck -p: solo corrige problemas que e2fsck considera "\n                "seguros para reparación automática."\n            ),',
              ),
              (
                  '"ARES no usa xfs_repair -L; un dirty log que requiera borrado bloquea la reparación automática.",',
                  '(\n                "ARES no usa xfs_repair -L; un dirty log que requiera borrado "\n                "bloquea la reparación automática."\n            ),',
              ),
              (
                  '"btrfs check --repair no se automatiza: la documentación upstream exige criterio experto y puede agravar corrupción.",',
                  '(\n                "btrfs check --repair no se automatiza: la documentación upstream "\n                "exige criterio experto y puede agravar corrupción."\n            ),',
              ),
              (
                  '"ntfsfix solo corrige inconsistencias NTFS fundamentales y solicita comprobación posterior de Windows.",',
                  '(\n                "ntfsfix solo corrige inconsistencias NTFS fundamentales y solicita "\n                "comprobación posterior de Windows."\n            ),',
              ),
          ):
              replace("src/ares/filesystems/adapters.py", old, new)
          replace(
              "src/ares/protection/service.py",
              '"El checkpoint es una copia a nivel de archivos, no un snapshot de bloques ni rollback del metadata del filesystem.",',
              '(\n                    "El checkpoint es una copia a nivel de archivos, no un snapshot de "\n                    "bloques ni rollback del metadata del filesystem."\n                ),',
          )
          replace(
              "src/ares/storage_operations/engine.py",
              'message="Reinspection found the original layout; transaction is aborted, not retried.",',
              'message=(\n                    "Reinspection found the original layout; transaction is aborted, "\n                    "not retried."\n                ),',
          )
          replace(
              "src/ares/storage_operations/engine.py",
              '"Architecture is modeled, but the executable adapter is disabled until filesystem-aware recovery exists."',
              '(\n                    "Architecture is modeled, but the executable adapter is disabled until "\n                    "filesystem-aware recovery exists."\n                )',
          )
          replace(
              "src/ares/storage_operations/engine.py",
              'description="Compare current multi-attribute device fingerprint with the approved target.",',
              'description=(\n                "Compare current multi-attribute device fingerprint with the approved target."\n            ),',
          )
          replace(
              "src/ares/storage_operations/executor.py",
              '"Create/delete are executable only when DataImpactAssessment allows table-only recovery.",',
              '(\n                    "Create/delete are executable only when DataImpactAssessment allows "\n                    "table-only recovery."\n                ),',
          )
          replace(
              "src/ares/storage_operations/executor.py",
              'def _validate[ModelT: BaseModel](model: type[ModelT], payload: dict[str, object], code: str) -> ModelT:',
              'def _validate[ModelT: BaseModel](\n    model: type[ModelT], payload: dict[str, object], code: str\n) -> ModelT:',
          )
          replace(
              "src/ares/storage_operations/policy.py",
              '"Partition resize/move requires filesystem-aware data movement policy that is not enabled.",',
              '(\n                "Partition resize/move requires filesystem-aware data movement policy "\n                "that is not enabled."\n            ),',
          )
          replace(
              "src/ares/tools/partition.py",
              'if identity.device_kind != "regular_file" and isinstance(raw_node, str):\n        if _SAFE_DEVICE.fullmatch(raw_node):\n            return raw_node',
              'if (\n        identity.device_kind != "regular_file"\n        and isinstance(raw_node, str)\n        and _SAFE_DEVICE.fullmatch(raw_node)\n    ):\n        return raw_node',
          )
          replace(
              "tests/test_backup_runtime.py",
              'assert json.loads(lines[0])["payload"]["password"] == "[REDACTED]"',
              'assert json.loads(lines[0])["payload"]["password"] == "[REDACTED]"  # noqa: S105',
          )
          replace(
              "tests/test_backup_tools.py",
              'match="BACKUP_(SOURCE|DESTINATION)_INVALID"',
              'match=r"BACKUP_(SOURCE|DESTINATION)_INVALID"',
          )
          # Avoid blocking pathlib I/O directly in async tests.
          backup_test = Path("tests/test_backup_tools.py")
          text = backup_test.read_text(encoding="utf-8")
          if "import asyncio\n" not in text:
              text = text.replace("import json\n", "import asyncio\nimport json\n")
          text = text.replace(
              'assert not Path(plan.destination.backup_path).exists()',
              'assert not await asyncio.to_thread(Path(plan.destination.backup_path).exists)',
          )
          text = text.replace(
              'assert not (ares_root / f".partial-{plan.backup_id}").exists()',
              'assert not await asyncio.to_thread((ares_root / f".partial-{plan.backup_id}").exists)',
          )
          backup_test.write_text(text, encoding="utf-8")

          fs_fail = Path("tests/test_filesystem_failures.py")
          text = fs_fail.read_text(encoding="utf-8")
          if "import asyncio\n" not in text:
              text = text.replace("from pathlib import Path\n", "import asyncio\nfrom pathlib import Path\n")
          text = text.replace(
              'Path(plan.target.canonical_path).unlink()',
              'await asyncio.to_thread(Path(plan.target.canonical_path).unlink)',
          )
          fs_fail.write_text(text, encoding="utf-8")

          replace(
              "tests/test_filesystem_adapters.py",
              '"/tmp/xfs.img"',
              '"/test-fixtures/xfs.img"',
          )

          # These integration tests intentionally invoke fixed system tools on disposable images.
          real = Path("tests/test_filesystem_real_image.py")
          text = real.read_text(encoding="utf-8")
          text = text.replace(
              'subprocess.run(("truncate", "-s", "32M", str(image)), check=True)',
              'subprocess.run(("truncate", "-s", "32M", str(image)), check=True)  # noqa: S603, S607',
          )
          text = text.replace(
              'subprocess.run(("mkfs.ext4", "-F", "-q", str(image)), check=True)',
              'subprocess.run(("mkfs.ext4", "-F", "-q", str(image)), check=True)  # noqa: S603, S607',
          )
          text = text.replace(
              'subprocess.run(\n        ("debugfs", "-w", "-R", "set_super_value free_blocks_count 1", str(image)),',
              'subprocess.run(  # noqa: S603\n        ("debugfs", "-w", "-R", "set_super_value free_blocks_count 1", str(image)),  # noqa: S607',
          )
          real.write_text(text, encoding="utf-8")
          PY
          uv run --frozen ruff format src tests
          uv run --frozen ruff check src tests
          uv run --frozen ruff format --check src tests

      - name: Commit code-only quality fixes
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          git restore --source=HEAD -- .github/workflows/backend-ci.yml .github/workflows/storage-quality-fix.yml
          git config user.name 'ARES quality fixer'
          git config user.email 'ares-quality-fixer@users.noreply.github.com'
          git add backend
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing workflow mutation from quality token' >&2
            exit 1
          fi
          git commit -m 'Fix Ruff violations across storage increment [quality-fixed]'
          git push origin HEAD:agent/storage-partition-management
