name: Boot Core Validator

on:
  push:
    branches: [agent/boot-recovery-management]

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[boot-core-validated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/boot-recovery-management
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Install
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Format
        working-directory: backend
        run: uv run --frozen ruff format src tests/test_boot_tools.py tests/test_boot_engine.py
      - name: Lint
        working-directory: backend
        run: uv run --frozen ruff check src tests/test_boot_tools.py tests/test_boot_engine.py
      - name: Type check
        working-directory: backend
        run: uv run --frozen mypy
      - name: Test Boot core
        working-directory: backend
        run: uv run --frozen pytest -q --no-cov tests/test_boot_tools.py tests/test_boot_engine.py
      - name: Commit formatted Boot code and tests
        run: |
          git config user.name 'ARES boot validator'
          git config user.email 'ares-boot-validator@users.noreply.github.com'
          git add backend/src backend/tests/test_boot_tools.py backend/tests/test_boot_engine.py
          git diff --cached --check
          git commit -m 'Validate Boot Recovery core [boot-core-validated]'
          git push origin HEAD:agent/boot-recovery-management
