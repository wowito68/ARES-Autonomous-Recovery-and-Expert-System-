name: Storage Consent Test Validator

on:
  push:
    branches: [agent/storage-partition-management]

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[storage-consent-validated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/storage-partition-management
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Install
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Format and safe autofix
        working-directory: backend
        run: |
          uv run --frozen ruff format tests/test_storage_consent_runtime_edges.py
          uv run --frozen ruff check --fix tests/test_storage_consent_runtime_edges.py
      - name: Lint
        working-directory: backend
        run: uv run --frozen ruff check src tests
      - name: Type check
        working-directory: backend
        run: uv run --frozen mypy
      - name: Test
        working-directory: backend
        run: uv run --frozen pytest -q --no-cov tests/test_storage_consent_runtime_edges.py tests/test_storage_operation_runtime.py tests/test_backup_runtime.py
      - name: Commit validated test
        run: |
          git config user.name 'ARES test validator'
          git config user.email 'ares-test-validator@users.noreply.github.com'
          git add backend/tests/test_storage_consent_runtime_edges.py
          git diff --cached --check
          git commit -m 'Format storage consent runtime tests [storage-consent-validated]'
          git push origin HEAD:agent/storage-partition-management
