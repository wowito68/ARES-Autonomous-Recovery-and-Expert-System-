name: Storage Engine Test Validator

on:
  push:
    branches: [agent/storage-partition-management]

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[storage-engine-validated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/storage-partition-management
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Install
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Normalize source
        run: |
          sed -i 's/token: str = "a"/fingerprint_char: str = "a"/' backend/tests/test_storage_engine_edges.py
          sed -i 's/fingerprint_sha256=token \* 64/fingerprint_sha256=fingerprint_char * 64/' backend/tests/test_storage_engine_edges.py
          sed -i 's/_identity(token="c")/_identity(fingerprint_char="c")/g' backend/tests/test_storage_engine_edges.py
          sed -i '0,/model="fixture",/s//model=f"fixture-{fingerprint_char}",/' backend/tests/test_storage_engine_edges.py
          sed -i 's/STORAGE_AUTHORIZATION_GRANT_UNAVAILABLE/STORAGE_OPERATION_NOT_AUTHORIZED/' backend/tests/test_storage_engine_edges.py
      - name: Format and autofix safe lint
        working-directory: backend
        run: |
          uv run --frozen ruff format tests/test_storage_engine_edges.py
          uv run --frozen ruff check --fix tests/test_storage_engine_edges.py
      - name: Lint
        working-directory: backend
        run: uv run --frozen ruff check src tests
      - name: Type check
        working-directory: backend
        run: uv run --frozen mypy
      - name: Test
        working-directory: backend
        run: uv run --frozen pytest -q --no-cov tests/test_storage_engine_edges.py
      - name: Commit validated test
        run: |
          git config user.name 'ARES test validator'
          git config user.email 'ares-test-validator@users.noreply.github.com'
          git add backend/tests/test_storage_engine_edges.py
          git diff --cached --check
          git commit -m 'Format storage engine edge tests [storage-engine-validated]'
          git push origin HEAD:agent/storage-partition-management
