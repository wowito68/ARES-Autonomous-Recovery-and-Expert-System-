name: Storage Edge Format

on:
  push:
    branches: [agent/storage-partition-management]

permissions:
  contents: write

jobs:
  format-and-validate:
    if: "!contains(github.event.head_commit.message, '[storage-edge-formatted]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/storage-partition-management
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Normalize edge test source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/tests/test_storage_partition_edges.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import asyncio\n', '')
          if 'import shutil\n' not in text:
              text = text.replace('import json\n', 'import json\nimport shutil\n', 1)
          text = text.replace(
              'identity.identify("/tmp/bad\\x00name")',
              'identity.identify(str(tmp_path / "bad") + "\\x00name")',
          )
          text = text.replace('partition_tools.shutil', 'shutil')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format edge tests
        working-directory: backend
        run: uv run --frozen ruff format tests/test_storage_partition_edges.py
      - name: Lint
        working-directory: backend
        run: uv run --frozen ruff check src tests
      - name: Type check
        working-directory: backend
        run: uv run --frozen mypy
      - name: Test edge coverage
        working-directory: backend
        run: uv run --frozen pytest -q --no-cov tests/test_storage_partition_edges.py tests/test_storage_operation_runtime.py tests/test_storage_partition_tools.py
      - name: Commit formatted test
        run: |
          git config user.name 'ARES test formatter'
          git config user.email 'ares-test-formatter@users.noreply.github.com'
          git add backend/tests/test_storage_partition_edges.py
          git diff --cached --check
          git commit -m 'Format storage partition edge tests [storage-edge-formatted]'
          git push origin HEAD:agent/storage-partition-management
