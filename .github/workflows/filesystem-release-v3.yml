name: Filesystem Repair Release V3

on:
  push:
    branches:
      - agent/filesystem-recovery-repair
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use newest branch head
        run: |
          sleep 30
          git fetch origin agent/filesystem-recovery-repair
          git reset --hard origin/agent/filesystem-recovery-repair
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Apply complete idempotent implementation cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_if(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace_if(
              'backend/tests/test_backup_vertical_slice.py',
              'async def test_backup_store_and_service_listing_are_shared(app: FastAPI, tmp_path: Path) -> None:\n',
              'async def test_backup_store_and_service_listing_are_shared(\n    client: AsyncClient, app: FastAPI, tmp_path: Path\n) -> None:\n    del client\n',
          )
          replace_if(
              'backend/src/ares/api/routes/filesystems.py',
              'return str(getattr(request.state, "request_id", "filesystem-session"))',
              'return str(getattr(request.state, "session_id", "filesystem-session"))',
          )
          vertical = Path('backend/tests/test_filesystem_vertical_slice.py')
          if vertical.exists():
              vertical.write_text(
                  vertical.read_text(encoding='utf-8').replace(
                      'session_id="filesystem-api-request-123",',
                      'session_id="filesystem-api-session-123",',
                  ), encoding='utf-8'
              )

          models_path = Path('backend/src/ares/filesystems/models.py')
          models = models_path.read_text(encoding='utf-8')
          if 'import sys\n' not in models:
              models = models.replace('from enum import StrEnum\n', 'from enum import StrEnum\nimport sys\n', 1)
          if 'class RuntimeOperatingSystem' not in models:
              models = models.replace(
                  'class FilesystemHealth(StrEnum):\n',
                  '''class RuntimeOperatingSystem(StrEnum):
    LINUX = "linux"
    WINDOWS = "windows"
    OTHER = "other"
    UNKNOWN = "unknown"


def detect_runtime_os() -> RuntimeOperatingSystem:
    if sys.platform.startswith("linux"):
        return RuntimeOperatingSystem.LINUX
    if sys.platform.startswith("win"):
        return RuntimeOperatingSystem.WINDOWS
    if sys.platform:
        return RuntimeOperatingSystem.OTHER
    return RuntimeOperatingSystem.UNKNOWN


class FilesystemHealth(StrEnum):
''', 1,
              )
          if 'runtime_os: RuntimeOperatingSystem' not in models:
              models = models.replace(
                  '    identity: DeviceIdentity\n    filesystem: FilesystemType | None = None\n',
                  '    identity: DeviceIdentity\n    runtime_os: RuntimeOperatingSystem = RuntimeOperatingSystem.UNKNOWN\n    filesystem: FilesystemType | None = None\n', 1,
              )
              models = models.replace(
                  '    target: DeviceIdentity\n    filesystem: FilesystemType\n',
                  '    target: DeviceIdentity\n    runtime_os: RuntimeOperatingSystem = RuntimeOperatingSystem.UNKNOWN\n    filesystem: FilesystemType\n', 1,
              )
          models_path.write_text(models, encoding='utf-8')

          tools_path = Path('backend/src/ares/tools/filesystem.py')
          tools = tools_path.read_text(encoding='utf-8')
          if 'from typing import Protocol\n' not in tools:
              tools = tools.replace(
                  'from collections.abc import Awaitable, Callable\n',
                  'from collections.abc import Awaitable, Callable\nfrom typing import Protocol\n', 1,
              )
          if 'class MountSafetyProvider(Protocol):' not in tools:
              tools = tools.replace(
                  'class MountSafetyChecker:\n',
                  'class MountSafetyProvider(Protocol):\n    def inspect(self, identity: DeviceIdentity) -> MountSafetyReport: ...\n\n\nclass MountSafetyChecker:\n', 1,
              )
          tools = tools.replace(
              '        mount_checker: MountSafetyChecker | None = None,\n',
              '        mount_checker: MountSafetyProvider | None = None,\n', 1,
          )
          if 'detect_runtime_os,' not in tools:
              tools = tools.replace('    ToolRequirement,\n)', '    ToolRequirement,\n    detect_runtime_os,\n)', 1)
          tools = tools.replace(
              '                identity=identity,\n                mount=mount,',
              '                identity=identity,\n                runtime_os=detect_runtime_os(),\n                mount=mount,',
          )
          tools = tools.replace(
              '            identity=identity,\n            filesystem=filesystem,',
              '            identity=identity,\n            runtime_os=detect_runtime_os(),\n            filesystem=filesystem,',
          )
          old_revalidate = '''    async def revalidate(self, expected: DeviceIdentity) -> DeviceIdentity:
        current = await self.identify(expected.requested_path)
        if current.fingerprint_sha256 != expected.fingerprint_sha256:
            raise FilesystemToolError("FILESYSTEM_DEVICE_IDENTITY_CHANGED")
        return current
'''
          if old_revalidate in tools:
              tools = tools.replace(old_revalidate, '''    async def revalidate(self, expected: DeviceIdentity) -> DeviceIdentity:
        try:
            current = await self.identify(expected.requested_path)
        except FilesystemToolError as exc:
            if exc.code == "FILESYSTEM_TARGET_NOT_FOUND":
                raise FilesystemToolError("FILESYSTEM_DEVICE_DISAPPEARED") from exc
            raise
        if current.fingerprint_sha256 != expected.fingerprint_sha256:
            raise FilesystemToolError("FILESYSTEM_DEVICE_IDENTITY_CHANGED")
        return current
''', 1)
          tools_path.write_text(tools, encoding='utf-8')

          service_path = Path('backend/src/ares/filesystems/service.py')
          service = service_path.read_text(encoding='utf-8')
          if '    ProtectionCheckpoint,\n' not in service:
              service = service.replace('from ares.protection import (\n', 'from ares.protection import (\n    ProtectionCheckpoint,\n', 1)
          service = service.replace('        checkpoint = None\n', '        checkpoint: ProtectionCheckpoint | None = None\n', 1)
          service = service.replace('        permissions = ("block-device.readwrite",)\n', '        permissions: tuple[str, ...] = ("block-device.readwrite",)\n', 1)
          if 'runtime_os=inspection.runtime_os,' not in service:
              service = service.replace(
                  '            target=inspection.identity,\n            filesystem=inspection.filesystem,',
                  '            target=inspection.identity,\n            runtime_os=inspection.runtime_os,\n            filesystem=inspection.filesystem,', 1,
              )
          old_result = '''            if result.status is not ExecutionStatus.SUCCEEDED:
                await self._mark_failed(
                    plan.repair_id, result.error_code or "FILESYSTEM_REPAIR_FAILED"
                )
'''
          if old_result in service:
              service = service.replace(old_result, '''            if result.status is not ExecutionStatus.SUCCEEDED:
                record = await self.store.get_repair(plan.repair_id)
                if record is not None and record.execution.status in {
                    RepairExecutionStatus.PLANNED,
                    RepairExecutionStatus.AUTHORIZING,
                }:
                    await self.event_bus.publish(
                        AresEvent(
                            event_type="repair.aborted",
                            source="filesystem.service",
                            correlation_id=plan.repair_id,
                            session_id=session_id,
                            severity=EventSeverity.WARNING,
                            payload={
                                "repair_id": plan.repair_id,
                                "error_code": result.error_code or "FILESYSTEM_REPAIR_ABORTED",
                            },
                        )
                    )
                    await self._mark_aborted(
                        plan.repair_id,
                        result.error_code or "FILESYSTEM_REPAIR_ABORTED",
                    )
                else:
                    await self._mark_failed(
                        plan.repair_id, result.error_code or "FILESYSTEM_REPAIR_FAILED"
                    )
''', 1)
          if 'async def _mark_aborted' not in service:
              service = service.replace(
                  '    async def _mark_failed(self, repair_id: str, code: str) -> None:\n',
                  '''    async def _mark_aborted(self, repair_id: str, code: str) -> None:
        record = await self.store.get_repair(repair_id)
        if record is None:
            return
        execution = record.execution.model_copy(
            update={
                "status": RepairExecutionStatus.ABORTED,
                "finished_at": datetime.now(UTC),
                "error_code": code,
            }
        )
        await self.store.put_repair(record.model_copy(update={"execution": execution}))

    async def _mark_failed(self, repair_id: str, code: str) -> None:
''', 1)
          service_path.write_text(service, encoding='utf-8')

          action_path = Path('backend/src/ares/actions/filesystem_repair.py')
          action = action_path.read_text(encoding='utf-8')
          verify_marker = '        if record is None:\n            raise ActionError("FILESYSTEM_REPAIR_RECORD_NOT_FOUND")\n        verification_status, message = _verification_status(plan, outcome)\n'
          if verify_marker in action:
              action = action.replace(verify_marker, '''        if record is None:
            raise ActionError("FILESYSTEM_REPAIR_RECORD_NOT_FOUND")
        verifying_execution = record.execution.model_copy(
            update={"status": RepairExecutionStatus.VERIFYING}
        )
        record = record.model_copy(update={"execution": verifying_execution})
        await self.store.put_repair(record)
        verification_status, message = _verification_status(plan, outcome)
''', 1)
          partial_guard = '''    if any(
        item in outcome.limitations
        for item in ("repair_tool_failed", "repair_tool_reported_unresolved_errors")
    ):
        return (
            RepairVerificationStatus.PARTIAL,
            "La herramienta de reparación reportó errores no resueltos; no se declara éxito total.",
        )
'''
          ntfs_marker = '    if plan.filesystem is FilesystemType.NTFS and outcome.repair_tool != "none":\n'
          if partial_guard not in action and ntfs_marker in action:
              action = action.replace(ntfs_marker, partial_guard + ntfs_marker, 1)
          action_path.write_text(action, encoding='utf-8')

          broker_path = Path('backend/src/ares/runtime/filesystem_broker.py')
          broker = broker_path.read_text(encoding='utf-8')
          if 'from collections.abc import Awaitable, Callable\n' not in broker:
              broker = broker.replace('import os\n', 'import os\nfrom collections.abc import Awaitable, Callable\n', 1)
          if 'FilesystemBrokerSend = Callable' not in broker:
              marker = 'from ares.tools.filesystem import FilesystemToolError, FilesystemToolSuite\n\n\n'
              broker = broker.replace(marker, marker + 'FilesystemBrokerSend = Callable[[dict[str, Any]], Awaitable[None]]\n\n\n', 1)
          broker = broker.replace('        send,\n    ) -> dict[str, Any]:', '        send: FilesystemBrokerSend,\n    ) -> dict[str, Any]:', 1)
          broker = broker.replace('    async def _authorize(self, request: dict[str, Any], send) -> dict[str, Any]:', '    async def _authorize(\n        self, request: dict[str, Any], send: FilesystemBrokerSend\n    ) -> dict[str, Any]:', 1)
          broker = broker.replace('    async def _execute(self, request: dict[str, Any], send) -> dict[str, Any]:', '    async def _execute(\n        self, request: dict[str, Any], send: FilesystemBrokerSend\n    ) -> dict[str, Any]:', 1)
          broker_path.write_text(broker, encoding='utf-8')

          # async-safe fixtures
          p = Path('backend/tests/test_filesystem_preflight_failures.py')
          text = p.read_text(encoding='utf-8')
          if '    DeviceIdentity,\n' not in text:
              text = text.replace('from ares.filesystems.models import (\n', 'from ares.filesystems.models import (\n    DeviceIdentity,\n', 1)
          text = text.replace('    def inspect(self, identity) -> MountSafetyReport:\n', '    def inspect(self, identity: DeviceIdentity) -> MountSafetyReport:\n', 1)
          if 'import asyncio\n' not in text:
              text = text.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nimport asyncio\n', 1)
          if 'def _write_fixture(path: Path, data: bytes) -> None:' not in text:
              text = text.replace('\n\nclass Runner:\n', '\n\ndef _write_fixture(path: Path, data: bytes) -> None:\n    path.write_bytes(data)\n\n\nclass Runner:\n', 1)
          text = text.replace('    image.write_bytes(b"ARES preflight fixture" * 512)\n', '    await asyncio.to_thread(\n        _write_fixture, image, b"ARES preflight fixture" * 512\n    )\n', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('backend/tests/test_filesystem_runtime.py')
          text = p.read_text(encoding='utf-8')
          if 'import asyncio\n' not in text:
              text = text.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nimport asyncio\n', 1)
          if 'def _write_fixture(path: Path, data: bytes) -> None:' not in text:
              text = text.replace('\n\ndef _result(tool: str, exit_code: int, stdout: str = "") -> ProcessResult:\n', '\n\ndef _write_fixture(path: Path, data: bytes) -> None:\n    path.write_bytes(data)\n\n\ndef _result(tool: str, exit_code: int, stdout: str = "") -> ProcessResult:\n', 1)
          text = text.replace('    image.write_bytes(b"ARES filesystem repair fixture" * 1024)\n', '    await asyncio.to_thread(\n        _write_fixture, image, b"ARES filesystem repair fixture" * 1024\n    )\n', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('backend/tests/test_filesystem_failures.py')
          text = p.read_text(encoding='utf-8')
          if 'def _write_fixture(path: Path, data: bytes) -> None:' not in text:
              text = text.replace('\n\nclass ImageRunner:\n', '\n\ndef _write_fixture(path: Path, data: bytes) -> None:\n    path.write_bytes(data)\n\n\ndef _unlink_fixture(path: Path) -> None:\n    path.unlink()\n\n\nclass ImageRunner:\n', 1)
          text = text.replace('    image.write_bytes(b"ARES failure fixture" * 512)\n', '    await asyncio.to_thread(\n        _write_fixture, image, b"ARES failure fixture" * 512\n    )\n', 1)
          text = text.replace('    Path(plan.target.canonical_path).unlink()\n', '    await asyncio.to_thread(_unlink_fixture, Path(plan.target.canonical_path))\n', 1)
          p.write_text(text, encoding='utf-8')

          js = Path('live/config/includes.chroot/usr/share/ares/platform/filesystem.js')
          js_text = js.read_text(encoding='utf-8')
          if 'const sessionId' not in js_text:
              js_text = js_text.replace('  const api = "/api/v1/filesystems";\n', '  const api = "/api/v1/filesystems";\n  const sessionId = `ui-${globalThis.crypto.randomUUID().replaceAll("-", "")}`;\n', 1)
          if '"X-ARES-Session-ID": sessionId' not in js_text:
              js_text = js_text.replace('headers: { "Content-Type": "application/json", ...(options.headers || {}) },', 'headers: { "Content-Type": "application/json", "X-ARES-Session-ID": sessionId, ...(options.headers || {}) },', 1)
          js.write_text(js_text, encoding='utf-8')
          PY
      - name: Write async-safe real ext4 image test
        run: |
          cat > backend/tests/test_filesystem_real_image.py <<'PY'
          from __future__ import annotations

          import asyncio
          import shutil
          from pathlib import Path
          from typing import Any

          import pytest

          from ares.filesystems.executor import LocalTestFilesystemExecutor
          from ares.filesystems.integrity import repair_plan_fingerprint
          from ares.filesystems.models import FilesystemHealth, FilesystemRepairPlan, FilesystemType, MountSafetyReport, RepairAction
          from ares.protection import ProtectionCheckpoint, ProtectionCheckpointStatus
          from ares.tools.filesystem import FilesystemToolSuite, MountSafetyChecker
          from ares.tools.storage import SafeProcessRunner

          REQUIRED = ("mkfs.ext4", "debugfs", "e2fsck", "blkid")

          def _create(path: Path) -> None:
              with path.open("wb") as handle:
                  handle.truncate(32 * 1024 * 1024)

          def test_real_ext4_image_is_detected_repaired_and_verified(tmp_path: Path) -> None:
              missing = [tool for tool in REQUIRED if shutil.which(tool) is None]
              if missing:
                  pytest.skip("isolated ext4 tools unavailable: " + ",".join(missing))
              image = tmp_path / "corrupted-ext4.img"
              _create(image)

              async def run() -> None:
                  runner = SafeProcessRunner()
                  assert (await runner.run("mkfs.ext4", ("-F", "-q", str(image)), timeout_seconds=60)).exit_code == 0
                  assert (await runner.run("debugfs", ("-w", "-R", "set_super_value free_blocks_count 1", str(image)), timeout_seconds=60)).exit_code == 0
                  tools = FilesystemToolSuite(runner=runner, mount_checker=MountSafetyChecker(scan_processes=False), allow_regular_file_targets=True)
                  executor = LocalTestFilesystemExecutor(tools)
                  inspection = await executor.inspect(str(image))
                  assert inspection.filesystem is FilesystemType.EXT4
                  assert inspection.health is FilesystemHealth.INCONSISTENT
                  resource = f"filesystem:{inspection.identity.fingerprint_sha256}"
                  checkpoint = ProtectionCheckpoint(status=ProtectionCheckpointStatus.READY, protected_resources=(resource,), resource_fingerprints={resource: inspection.identity.fingerprint_sha256}, provider_capability_id="backup.create", backup_id="real-image-backup-12345678", verification_id="real-image-verification-12345678", session_id="real-image-session-123", evidence_sha256="e" * 64, limitations=("synthetic checkpoint for isolated image fixture",))
                  draft = FilesystemRepairPlan(session_id="real-image-session-123", target=inspection.identity, filesystem=FilesystemType.EXT4, mount=MountSafetyReport(mounted=False, busy=False, swap=False, safe_to_unmount=False, safe_to_remount=False), detected_problems=inspection.check.problems if inspection.check else (), evidence=inspection.check.evidence if inspection.check else (), required_tools=inspection.required_tools, required_permissions=("block-device.readwrite",), protection_checkpoint=checkpoint, repair_actions=(RepairAction(id="filesystem.repair", description="Repair only isolated ext4 image", mutates_target=True),), verification_steps=("Run e2fsck -f -n after repair",), rollback_strategy="Discardable image; no physical device", executable=True, fingerprint_sha256="0" * 64)
                  plan = draft.model_copy(update={"fingerprint_sha256": repair_plan_fingerprint(draft)})
                  challenges: list[str] = []
                  async def challenge(value: str) -> None: challenges.append(value)
                  grant = await executor.request_authorization(plan, on_challenge=challenge)
                  stages: list[str] = []
                  async def stage(name: str, payload: dict[str, Any]) -> None:
                      del payload
                      stages.append(name)
                  outcome = await executor.execute(plan, grant, on_stage=stage)
                  assert challenges
                  assert outcome.before.health is FilesystemHealth.INCONSISTENT
                  assert outcome.repair_tool == "e2fsck"
                  assert outcome.repair_exit_code in {0, 1, 2}
                  assert outcome.after.health is FilesystemHealth.HEALTHY
                  assert "filesystem.repair-command.started" in stages
                  assert "filesystem.verification.completed" in stages
              asyncio.run(run())
          PY
      - name: Ensure required docs and strict CI
        run: |
          test -f docs/capabilities/filesystem-repair.md || cat > docs/capabilities/filesystem-repair.md <<'EOF'
          # Filesystem Recovery & Repair
          `filesystem.repair@1.0.0` is high-risk, mutating, checkpoint- and authorization-gated. Supported automated repair adapters are ext2/ext3/ext4, XFS and limited NTFS. Btrfs is inspect/read-only-check only. See ADR-0010 for privilege and verification boundaries. Success always requires structured post-repair verification; there is no force-unmount, ext `-y`, XFS `-L`, Btrfs `--repair`, or metadata rollback path.
          EOF
          test -f docs/adr/0010-filesystem-repair-privilege-and-verification-boundary.md || cat > docs/adr/0010-filesystem-repair-privilege-and-verification-boundary.md <<'EOF'
          # ADR-0010: Filesystem repair privilege and verification boundary
          Status: Accepted.
          FastAPI remains `PrivateDevices=yes` and unprivileged. The broker alone owns raw-device effects and receives CAP_SYS_ADMIN for mount/unmount while retaining systemd confinement, peer UID checks, semantic fixed-policy requests, independent consent, durable audit, exact plan hash, exact device identity and independently reloaded durable ProtectionCheckpoint. Running metadata repair cannot be force-cancelled. Btrfs mutation, XFS log-zeroing and metadata rollback are out of scope.
          EOF
          cat > .github/workflows/backend-ci.yml <<'EOF'
          name: Backend CI
          on: [push, pull_request, workflow_dispatch]
          permissions:
            contents: read
          jobs:
            quality:
              name: Python quality and build
              runs-on: ubuntu-latest
              defaults: {run: {working-directory: backend}}
              steps:
                - uses: actions/checkout@v6
                  with: {persist-credentials: false}
                - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
                  with: {version: "0.11.14", python-version: "3.12", working-directory: backend}
                - run: uv sync --frozen --dev
                - run: uv run --frozen ruff format --check src tests
                - run: uv run --frozen ruff check src tests
                - run: uv run --frozen mypy
                - run: uv build
            tests:
              name: Tests / Python ${{ matrix.python-version }}
              runs-on: ubuntu-latest
              strategy: {fail-fast: false, matrix: {python-version: ["3.12", "3.13"]}}
              defaults: {run: {working-directory: backend}}
              steps:
                - uses: actions/checkout@v6
                  with: {persist-credentials: false}
                - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
                  with: {version: "0.11.14", python-version: "${{ matrix.python-version }}", working-directory: backend}
                - run: uv sync --frozen --dev
                - run: uv run --frozen pytest --cov-report=term-missing
            syntax:
              name: Shell and UI syntax
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v6
                  with: {persist-credentials: false}
                - run: node --check live/config/includes.chroot/usr/share/ares/platform/app.js && node --check live/config/includes.chroot/usr/share/ares/platform/storage.js && node --check live/config/includes.chroot/usr/share/ares/platform/backup.js && node --check live/config/includes.chroot/usr/share/ares/platform/filesystem.js
          EOF
      - name: Python 3.12 quality, build and tests
        working-directory: backend
        run: |
          uv sync --frozen --dev --python 3.12
          uv run --frozen ruff check --fix src tests || true
          uv run --frozen ruff format src tests
          uv run --frozen ruff format --check src tests
          uv run --frozen ruff check src tests
          uv run --frozen mypy
          uv build
          uv run --frozen pytest --junitxml=/tmp/j312.xml --cov-report=term-missing --cov-report=xml:/tmp/c312.xml
      - name: Python 3.13 full tests
        working-directory: backend
        run: |
          rm -rf .venv
          uv sync --frozen --dev --python 3.13
          uv run --frozen pytest --junitxml=/tmp/j313.xml --cov-report=term-missing --cov-report=xml:/tmp/c313.xml
      - name: Static syntax
        run: |
          node --check live/config/includes.chroot/usr/share/ares/platform/app.js
          node --check live/config/includes.chroot/usr/share/ares/platform/storage.js
          node --check live/config/includes.chroot/usr/share/ares/platform/backup.js
          node --check live/config/includes.chroot/usr/share/ares/platform/filesystem.js
      - name: Record validation and remove all temporary workflows
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          def s(v):
              j=ET.parse(f'/tmp/j{v}.xml').getroot(); c=ET.parse(f'/tmp/c{v}.xml').getroot()
              return int(j.attrib.get('tests',0)), int(j.attrib.get('failures',0)), int(j.attrib.get('errors',0)), int(j.attrib.get('skipped',0)), float(c.attrib['line-rate'])*100
          a=s('312'); b=s('313')
          Path('docs/capabilities/filesystem-repair-validation.md').write_text(f'# Filesystem Recovery & Repair — validated\n\n| Python | Tests | Failures | Errors | Skipped | Coverage |\n|---|---:|---:|---:|---:|---:|\n|3.12|{a[0]}|{a[1]}|{a[2]}|{a[3]}|{a[4]:.2f}%|\n|3.13|{b[0]}|{b[1]}|{b[2]}|{b[3]}|{b[4]:.2f}%|\n\nRuff format/lint, strict mypy, build and JS syntax passed. The suite includes a real temporary ext4 image corruption→repair→verification test and never writes a physical disk.\n', encoding='utf-8')
          PY
          rm -f .github/workflows/filesystem-maintenance.yml .github/workflows/filesystem-finalize.yml .github/workflows/filesystem-release-verification.yml .github/workflows/filesystem-release-verification-v2.yml .github/workflows/filesystem-quality-patch.yml .github/workflows/filesystem-async-test-patch.yml .github/workflows/filesystem-release-v3.yml
      - name: Publish only validated tree
        run: |
          git config user.name "ARES Release V3"
