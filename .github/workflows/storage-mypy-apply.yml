name: Storage Mypy Apply

on:
  push:
    branches: [agent/storage-partition-management]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[mypy-fixed]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/storage-partition-management
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Apply strict typing patch
        run: |
          python3 scripts/storage_mypy_bootstrap.py
          python3 scripts/storage_mypy_patch.py
      - name: Validate strict quality
        working-directory: backend
        run: |
          uv run --frozen ruff format src tests
          uv run --frozen ruff check --fix src tests
          uv run --frozen ruff format src tests
          uv run --frozen ruff check src tests
          uv run --frozen mypy
      - name: Validate full behavior without coverage gate
        working-directory: backend
        run: uv run --frozen pytest -q --no-cov
      - name: Commit validated code-only typing fixes
        run: |
          git config user.name 'ARES mypy fixer'
          git config user.email 'ares-mypy-fixer@users.noreply.github.com'
          git add backend
          git diff --cached --check
          git commit -m 'Restore strict mypy across storage increment [mypy-fixed]'
          git push origin HEAD:agent/storage-partition-management
