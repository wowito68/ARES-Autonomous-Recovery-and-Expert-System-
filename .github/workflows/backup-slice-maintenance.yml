name: Backup slice maintenance

on:
  push:
    branches:
      - agent/backup-snapshot-manager

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/backup-snapshot-manager

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.14"
          python-version: "3.12"
          working-directory: backend

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --frozen --dev

      - name: Update existing docs and frontend loader
        shell: python
        run: |
          from pathlib import Path

          additions = {
              "docs/architecture.md": r'''

          ## Backup & Snapshot Manager increment

          `backup.create`, `backup.verify` and `backup.list` extend the v2 Capability platform without bypassing the existing Runtime boundaries. Planning and orchestration stay in the backend; production writes execute only through `ares-tool-broker`. Authorization is owned by the independent `ares-consent-agent`, and mutation intent/completion is acknowledged by the independent HMAC Audit Ledger. The Knowledge Graph now represents backup source, destination, backup, entry and verification nodes. Full format and boundary details are in `docs/capabilities/backup.md` and ADR-0009.

          The Capability SDK also exposes `requires_protection_checkpoint`. `CapabilityManager` rejects a future mutating Capability that enables this flag unless a same-session, verified `ProtectionCheckpoint` is supplied. No destructive Capability is enabled by this increment.
          ''',
              "docs/agent-and-tools.md": r'''

          ## Backup planning and Agent behavior

          The Agent may interpret requests such as “haz un respaldo de mis documentos”, discover `backup.create`, identify a source and ask for a destination when no safe destination is known. It may explain or propose the structured `BackupPlan`, but it cannot call filesystem Tools directly and cannot grant consent. The plan, free-space calculation, exclusions, device identities, checksums and verification are deterministic backend/Tool Layer data rather than LLM claims.

          Production mutation follows `Agent -> Reasoning -> BackupService -> CapabilityManager -> Workflow -> semantic Broker request`. The broker accepts no arbitrary shell or argv. The independent local operator channel must approve the exact plan fingerprint before the broker obtains a one-use grant.
          ''',
              "docs/security.md": r'''

          ## Backup mutation security

          `backup.create` is the first `risk=medium` mutating Capability. FastAPI does not gain destination-write privilege in production. `ares-tool-broker` revalidates source/destination identity, same-filesystem/same-device rules, free space, plan fingerprint and target absence before writing. Requested roots reject traversal and symlink components; copy operations use no-follow/exclusive descriptors and publish through a private partial directory plus atomic rename. Existing backups are never overwritten.

          Consent is independent from API/UI. `ares-consent-agent` displays the exact plan and accepts approval only from the trusted local operator peer with a fingerprint-derived phrase. The broker can request/wait for consent but cannot approve it. Before side effects, the broker requires a durable Audit Ledger acknowledgement. The HMAC chain detects record alteration/reordering; lack of an external rollback/monotonic anchor remains documented technical debt in ADR-0009.
          ''',
              "docs/data.md": r'''

          ## Backup data

          ARES persists private backup metadata under the Capability state directory: immutable plans, `Backup` records, manifests and verification results. User backup payloads are stored only in the selected destination under `ARES/<backup-id>/`; temporary copies use `.partial-<backup-id>` and are removed on cancellation/failure before publication.

          Manifest format 1.0 stores relative paths, entry type, size, mtime, permission mode and SHA-256 for regular files, plus source metadata and a manifest SHA-256. The destination also contains `.ares-manifest.json`; verification requires it to match the authoritative ARES manifest. Event payloads avoid unnecessary path disclosure; per-entry events use path tokens. The Knowledge Graph projects at most 1,024 entry nodes per backup while the full manifest remains authoritative.
          ''',
              "docs/api.md": r'''

          ## Backup API

          The backup API is a thin projection over `BackupService`:

          - `POST /api/v1/backups/plan` — create a structured, non-mutating BackupPlan.
          - `POST /api/v1/backups` — request independent authorization and asynchronously start `backup.create` for an existing plan.
          - `GET /api/v1/backups` — list known backups.
          - `GET /api/v1/backups/{id}` — read state/progress.
          - `GET /api/v1/backups/{id}/manifest` — read the authoritative manifest.
          - `GET /api/v1/backups/{id}/verification` — read latest verification.
          - `POST /api/v1/backups/{id}/verify` — run `backup.verify` again.
          - `POST /api/v1/backups/{id}/cancel` — request cancellation.

          `POST /backups` does not grant authorization. Production execution waits for the independent local consent challenge. Errors continue to use Problem Details and stable ARES error codes.
          ''',
              "docs/roadmap.md": r'''

          ## Backup & Snapshot Manager status

          Implemented in the initial backup increment: structured backup planning, `backup.create`, `backup.verify`, `backup.list`, local/mounted/USB destination classification, plan-bound independent consent, transactional local copy, SHA-256 manifest, corruption detection, progress/cancellation, Knowledge Graph projection, Event Bus integration, independent audit boundary and the `ProtectionCheckpoint` policy contract.

          Explicitly deferred: incremental/differential backup, filesystem snapshots, restore automation, remote/cloud destinations, mandatory encryption, deduplication, advanced compression and scheduling. `ProtectionCheckpoint` orchestration is also deferred: the CapabilityManager gate exists, but no destructive Capability is enabled and no automatic backup/snapshot checkpoint is claimed.
          ''',
          }

          marker = "## Backup & Snapshot Manager increment"
          per_file_markers = {
              "docs/architecture.md": marker,
              "docs/agent-and-tools.md": "## Backup planning and Agent behavior",
              "docs/security.md": "## Backup mutation security",
              "docs/data.md": "## Backup data",
              "docs/api.md": "## Backup API",
              "docs/roadmap.md": "## Backup & Snapshot Manager status",
          }
          for raw_path, addition in additions.items():
              path = Path(raw_path)
              current = path.read_text(encoding="utf-8")
              if per_file_markers[raw_path] not in current:
                  path.write_text(current.rstrip() + addition + "\n", encoding="utf-8")

          index = Path("live/config/includes.chroot/usr/share/ares/platform/index.html")
          html = index.read_text(encoding="utf-8")
          loader = '<script src="/backup.js" defer></script>'
          if loader not in html:
              html = html.replace("</body>", f"  {loader}\n</body>")
              index.write_text(html, encoding="utf-8")

          main = Path("backend/src/ares/main.py")
          text = main.read_text(encoding="utf-8")
          text = text.replace("from fastapi.responses import HTMLResponse\n", "")
          start = text.find("        index_path = resolved_settings.static_dir / \"index.html\"\n")
          if start >= 0:
              mount = text.find("        application.mount(\n", start)
              if mount < 0:
                  raise RuntimeError("static mount block not found")
              text = text[:start] + text[mount:]
          main.write_text(text, encoding="utf-8")

      - name: Restore strict backend CI definition
        shell: python
        run: |
          from pathlib import Path
          Path(".github/workflows/backend-ci.yml").write_text(r'''name: Backend CI

          on:
            push:
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            quality:
              name: Python quality and build
              runs-on: ubuntu-latest
              timeout-minutes: 15
              defaults:
                run:
                  working-directory: backend
              steps:
                - name: Check out repository
                  uses: actions/checkout@v6
                  with:
                    persist-credentials: false

                - name: Install uv and Python 3.12
                  uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
                  with:
                    version: "0.11.14"
                    python-version: "3.12"
                    working-directory: backend

                - name: Install locked dependencies
                  run: uv sync --frozen --dev

                - name: Enforce formatting
                  run: uv run --frozen ruff format --check src tests

                - name: Enforce Ruff
                  run: uv run --frozen ruff check src tests

                - name: Enforce strict mypy
                  run: uv run --frozen mypy

                - name: Build package
                  run: uv build

            tests:
              name: Tests / Python ${{ matrix.python-version }}
              runs-on: ubuntu-latest
              timeout-minutes: 20
              strategy:
                fail-fast: false
                matrix:
                  python-version: ["3.12", "3.13"]
              defaults:
                run:
                  working-directory: backend
              steps:
                - name: Check out repository
                  uses: actions/checkout@v6
                  with:
                    persist-credentials: false

                - name: Install uv and Python ${{ matrix.python-version }}
                  uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
                  with:
                    version: "0.11.14"
                    python-version: ${{ matrix.python-version }}
                    working-directory: backend

                - name: Install locked dependencies
                  run: uv sync --frozen --dev

                - name: Run tests with coverage gate
                  run: >-
                    uv run --frozen pytest
                    --junitxml=test-results-${{ matrix.python-version }}.xml
                    --cov-report=term-missing
                    --cov-report=xml:coverage-${{ matrix.python-version }}.xml

            static-syntax:
              name: Shell and UI syntax
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Check out repository
                  uses: actions/checkout@v6
                  with:
                    persist-credentials: false

                - name: Validate tracked shell scripts
                  shell: bash
                  run: |
                    set -euo pipefail
                    checked=0
                    while IFS= read -r -d '' file; do
                      first_line="$(head -n 1 "$file" || true)"
                      case "$first_line" in
                        *bash*)
                          bash -n "$file"
                          checked=$((checked + 1))
                          ;;
                        *"/sh"*)
                          dash -n "$file"
                          checked=$((checked + 1))
                          ;;
                      esac
                    done < <(git ls-files -z)
                    echo "Validated ${checked} tracked shell scripts."

                - name: Validate platform JavaScript syntax
                  run: |
                    node --check live/config/includes.chroot/usr/share/ares/platform/app.js
                    node --check live/config/includes.chroot/usr/share/ares/platform/storage.js
                    node --check live/config/includes.chroot/usr/share/ares/platform/backup.js
          ''', encoding="utf-8")

      - name: Apply Ruff formatter to tracked backend code and tests
        working-directory: backend
        run: uv run --frozen ruff format src tests

      - name: Commit maintained files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src backend/tests docs live/config/includes.chroot/usr/share/ares/platform/index.html .github/workflows/backend-ci.yml
          if git diff --cached --quiet; then
            echo "No maintenance changes needed."
            exit 0
          fi
          git commit -m "chore: format and document backup slice"
          git push origin HEAD:agent/backup-snapshot-manager
